<script>
// ============================================================
// CONFIGURAÇÃO E VARIÁVEIS GLOBAIS
// ============================================================

const API_BASE_URL = 'https://api-pedidos.gtgo.com.br';
const STORAGE_KEY = 'pagamentos_confirmados';

var pedidosData = [];
var pagamentosBackend = {};
var modoVisualizacao = 'tabela';
var pedidosFiltrados = [];
var currentUser = null;
var produtosData = [];
var produtosPorPedido = {};
var buscandoPedido = false;
var tentouRecarregar = false;
var modoBuscaAtivo = false;
var periodoBusca = 'todo';
var termoBusca = '';

var ordenacaoProdutosPorPedido = { coluna: null, ordem: 'asc' };
var periodoAtualProdutosPorPedido = 'todo';
var periodoAtualMaisPedidos = 'todo';
var organizacaoAtualMaisPedidos = 'vezes';
var periodoAtualMaiorLucro = 'todo';
var organizacaoAtualMaiorLucro = 'valor';
var periodoAtualMenosPedidos = 'todo';
var organizacaoAtualMenosPedidos = 'vezes';
var periodoAtualDiferenca = 'todo';
var organizacaoAtualDiferenca = 'compra';

var nomesMeses = {
    '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril',
    '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto',
    '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro'
};

// ============================================================
// FUNÇÕES AUXILIARES
// ============================================================

function getNomeMes(numero) { return nomesMeses[numero] || numero; }

function formatarMoedaBR(valor) {
    return 'R$ ' + valor.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function formatarDataBR(iso) {
    if (!iso) return '';
    if (iso === 'Sem Data') return 'Sem Data';
    var p = iso.split('-');
    if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
    return iso;
}

function limparValorProduto(valor) {
    if (!valor || valor === '') return 0;
    var str = String(valor).replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
    return parseFloat(str) || 0;
}

function dataParaComparacao(dataStr) {
    var partes = dataStr.split('/');
    if (partes.length === 3) {
        return new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
    }
    return new Date(dataStr);
}

function mesAnoParaComparacao(dataStr) {
    if (!dataStr || dataStr === 'Sem Data' || dataStr === '') return null;
    var partes = dataStr.split('/');
    if (partes.length === 3 && partes[1] && partes[2]) {
        var mes = partes[1].padStart(2, '0');
        return mes + '/' + partes[2];
    }
    var partesISO = dataStr.split('-');
    if (partesISO.length === 3 && partesISO[1] && partesISO[0]) {
        var mes = partesISO[1].padStart(2, '0');
        return mes + '/' + partesISO[0];
    }
    return null;
}

function formatarMesAnoComNome(mesAno) {
    if (!mesAno) return null;
    var partes = mesAno.split('/');
    if (partes.length !== 2) return mesAno;
    var mes = partes[0].padStart(2, '0');
    var ano = partes[1];
    return getNomeMes(mes) + ' - ' + mes + '/' + ano;
}

function showNotification(message, type) {
    type = type || 'info';
    var colors = {
        success: 'bg-green-100 border-green-400 text-green-700',
        error: 'bg-red-100 border-red-400 text-red-700',
        loading: 'bg-blue-100 border-blue-400 text-blue-700',
        info: 'bg-blue-100 border-blue-400 text-blue-700'
    };
    var div = document.createElement('div');
    div.className = 'fixed bottom-4 right-4 p-4 rounded-lg border ' + (colors[type] || colors.info) + ' shadow-lg z-50 max-w-md';
    div.innerHTML = message;
    document.body.appendChild(div);
    setTimeout(function() { div.remove(); }, 5000);
}

function copiarTexto(texto) {
    if (!texto || texto === 'Nenhum' || texto === '') {
        alert('⚠️ Nenhum código disponível para copiar.');
        return;
    }
    navigator.clipboard.writeText(texto).then(function() {
        alert('✅ Código copiado para a área de transferência!');
    }).catch(function() {
        var textarea = document.createElement('textarea');
        textarea.value = texto;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ Código copiado!');
    });
}

function extrairParcelaInfo(texto) {
    if (!texto || texto === 'Nenhum') return null;
    var valorMatch = texto.match(/Valor:\s*R\$\s*([\d\.,]+)/);
    var vencMatch = texto.match(/Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/);
    var status = 'A vencer';
    if (texto.indexOf('Pagos') !== -1) status = 'Pagos';
    else if (texto.indexOf('Em atraso') !== -1) status = 'Em atraso';
    else if (texto.indexOf('A vencer') !== -1) status = 'A vencer';
    return {
        valor: valorMatch ? parseFloat(valorMatch[1].replace(/\./g, '').replace(',', '.')) : 0,
        vencimento: vencMatch ? vencMatch[1] : '',
        status: status
    };
}

function parseCSVLinha(linha) {
    var res = [];
    var dentro = false;
    var val = '';
    for (var ch = 0; ch < linha.length; ch++) {
        var c = linha[ch];
        if (c === '"') dentro = !dentro;
        else if (c === ',' && !dentro) { res.push(val); val = ''; }
        else val += c;
    }
    res.push(val);
    return res;
}

function getSemanaAtual() {
    var hoje = new Date();
    var diaSemana = hoje.getDay();
    var diffSabado = (diaSemana - 6 + 7) % 7;
    var sabado = new Date(hoje);
    sabado.setDate(hoje.getDate() - diffSabado);
    var sexta = new Date(sabado);
    sexta.setDate(sabado.getDate() + 6);
    return { sabado: sabado, sexta: sexta };
}

function getMesAtual() {
    var hoje = new Date();
    var primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    var ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    return { primeiroDia: primeiroDia, ultimoDia: ultimoDia };
}

function getProximaSemana() {
    var hoje = new Date();
    var diaSemana = hoje.getDay();
    var diasAteSabado = (6 - diaSemana + 7) % 7;
    if (diasAteSabado === 0) diasAteSabado = 7;
    var sabado = new Date(hoje);
    sabado.setDate(hoje.getDate() + diasAteSabado);
    var sexta = new Date(sabado);
    sexta.setDate(sabado.getDate() + 6);
    return { sabado: sabado, sexta: sexta };
}

async function buscarPagamentosBackend() {
    try {
        var response = await fetch(API_BASE_URL + '/api/pagamentos', { credentials: 'include' });
        if (!response.ok) throw new Error('Erro ao buscar pagamentos');
        var data = await response.json();
        var pagamentos = {};
        data.forEach(function(p) {
            var chave = p.pedido + '_' + p.parcela + '_' + p.tipo;
            pagamentos[chave] = p.pago;
        });
        pagamentosBackend = pagamentos;
        localStorage.setItem('pagamentos_backend', JSON.stringify(pagamentos));
        return pagamentos;
    } catch (error) {
        console.warn('Erro ao buscar pagamentos do backend:', error);
        var cached = localStorage.getItem('pagamentos_backend');
        if (cached) {
            pagamentosBackend = JSON.parse(cached);
            return pagamentosBackend;
        }
        return {};
    }
}

async function salvarPagamentoBackend(pedidoId, parcelaId, tipo, pago) {
    var data = { pedido: pedidoId, parcela: parcelaId, tipo: tipo, pago: pago };
    try {
        var response = await fetch(API_BASE_URL + '/api/pagamento', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
        });
        if (!response.ok) throw new Error(await response.text());
        var chave = pedidoId + '_' + parcelaId + '_' + tipo;
        if (pago) pagamentosBackend[chave] = true;
        else delete pagamentosBackend[chave];
        localStorage.setItem('pagamentos_backend', JSON.stringify(pagamentosBackend));
        return true;
    } catch (error) {
        console.error('❌ Erro ao salvar pagamento:', error);
        var chave = pedidoId + '_' + parcelaId + '_' + tipo;
        var pagamentosLocal = carregarPagamentosSalvos();
        if (pago) pagamentosLocal[chave] = true;
        else delete pagamentosLocal[chave];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(pagamentosLocal));
        return false;
    }
}

function carregarPagamentosSalvos() {
    try {
        var dados = localStorage.getItem(STORAGE_KEY);
        return dados ? JSON.parse(dados) : {};
    } catch { return {}; }
}

function isPago(pedidoId, parcelaId, tipo) {
    var chave = pedidoId + '_' + parcelaId + '_' + tipo;
    if (pagamentosBackend && pagamentosBackend[chave] !== undefined) return pagamentosBackend[chave];
    var local = carregarPagamentosSalvos();
    return local[chave] || false;
}

function processarDadosPlanilha(data) {
    if (!data || data.length < 2) return [];
    
    var MAX_INDEX = 67;
    var pedidos = [];
    
    var idxPedido = 0, idxData = 1, idxNF = 2, idxValorTotal = 3;
    var idxValorProdutos = 4, idxRoyalties = 5, idxPropaganda = 6, idxParcelas = 7;
    var idxProdutoParcelas = 10, idxRoyaltiesParcelas = 29, idxPropagandaParcelas = 48;
    
    var produtoValores = [11, 14, 17, 20, 23, 26];
    var royaltiesValores = [30, 33, 36, 39, 42, 45];
    var propagandaValores = [49, 52, 55, 58, 61, 64];
    var produtoPix = [12, 15, 18, 21, 24, 27];
    var produtoBarras = [13, 16, 19, 22, 25, 28];
    var royaltiesBarras = [32, 35, 38, 41, 44, 47];
    var propagandaBarras = [51, 54, 57, 60, 63, 66];
    
    for (var i = 1; i < data.length; i++) {
        var valores = data[i];
        if (valores.length < MAX_INDEX) {
            var novosValores = valores.slice();
            for (var j = valores.length; j < MAX_INDEX; j++) novosValores[j] = '';
            valores = novosValores;
        }
        if (valores.length < 10) continue;
        
        var pedidoId = String(valores[idxPedido] || '').trim();
        if (!pedidoId || pedidoId === 'Pedido') continue;
        
        var dataEmissao = String(valores[idxData] || '').trim();
        var isSemData = dataEmissao === 'Sem Data';
        
        if (isSemData) {
            var valorTotal = 0;
            if (valores[idxValorTotal]) {
                var valStr = String(valores[idxValorTotal]).replace('R$', '').replace(/\./g, '').replace(',', '.');
                valorTotal = parseFloat(valStr) || 0;
            }
            var totalParcelas = 0;
            if (valores[idxParcelas]) {
                var match = String(valores[idxParcelas]).match(/(\d+)x/);
                if (match) totalParcelas = parseInt(match[1]);
            }
            pedidos.push({
                pedido: pedidoId,
                dataEmissao: 'Sem Data',
                notaFiscal: 'Sem NF',
                valorTotal: valorTotal,
                valorProdutos: 0,
                valorRoyalties: 0,
                valorPropaganda: 0,
                totalParcelas: totalParcelas,
                parcelasProdutoCount: 0,
                parcelasRoyaltiesCount: 0,
                parcelasPropagandaCount: 0,
                parcelasProduto: [],
                parcelasRoyalties: [],
                parcelasPropaganda: [],
                valorPendente: valorTotal,
                totalmentePago: false,
                emProcessamento: false,
                isSemData: true
            });
            continue;
        }
        
        var valorTotal = 0;
        if (valores[idxValorTotal]) {
            var valStr = String(valores[idxValorTotal]).replace('R$', '').replace(/\./g, '').replace(',', '.');
            valorTotal = parseFloat(valStr) || 0;
        }
        
        var valorProdutos = 0, valorRoyaltiesVal = 0, valorPropagandaVal = 0;
        if (valores[idxValorProdutos]) {
            var valStr = String(valores[idxValorProdutos]).replace('R$', '').replace(/\./g, '').replace(',', '.');
            valorProdutos = parseFloat(valStr) || 0;
        }
        if (valores[idxRoyalties]) {
            var valStr = String(valores[idxRoyalties]).replace('R$', '').replace(/\./g, '').replace(',', '.');
            valorRoyaltiesVal = parseFloat(valStr) || 0;
        }
        if (valores[idxPropaganda]) {
            var valStr = String(valores[idxPropaganda]).replace('R$', '').replace(/\./g, '').replace(',', '.');
            valorPropagandaVal = parseFloat(valStr) || 0;
        }
        
        var totalParcelas = 0;
        if (valores[idxParcelas]) {
            var match = String(valores[idxParcelas]).match(/(\d+)x/);
            if (match) totalParcelas = parseInt(match[1]);
        }
        
        var parcelasProduto = [];
        var parcelasRoyalties = [];
        var parcelasPropaganda = [];
        
        var parcelasProdutoCount = 0;
        if (valores[idxProdutoParcelas]) {
            var match = String(valores[idxProdutoParcelas]).match(/(\d+)x/);
            if (match) parcelasProdutoCount = parseInt(match[1]);
        }
        for (var p = 0; p < produtoValores.length && p < parcelasProdutoCount; p++) {
            var idxValor = produtoValores[p];
            var codigoPix = '', codigoBarras = '';
            if (produtoPix[p] < valores.length) {
                codigoPix = String(valores[produtoPix[p]] || '').trim();
                if (codigoPix === 'Nenhum' || codigoPix === '') codigoPix = '';
            }
            if (produtoBarras[p] < valores.length) {
                codigoBarras = String(valores[produtoBarras[p]] || '').trim();
                if (codigoBarras === 'Nenhum' || codigoBarras === '') codigoBarras = '';
            }
            var valorRaw = idxValor < valores.length ? valores[idxValor] : '';
            if (valorRaw && String(valorRaw) !== 'Nenhum') {
                var info = extrairParcelaInfo(String(valorRaw));
                if (info) {
                    parcelasProduto.push({
                        num: p + 1,
                        valor: info.valor,
                        vencimento: info.vencimento,
                        status: info.status,
                        codigoPix: codigoPix,
                        codigoBarras: codigoBarras
                    });
                }
            }
        }
        
        var parcelasRoyaltiesCount = 0;
        if (valores[idxRoyaltiesParcelas]) {
            var match = String(valores[idxRoyaltiesParcelas]).match(/(\d+)x/);
            if (match) parcelasRoyaltiesCount = parseInt(match[1]);
        }
        for (var p = 0; p < royaltiesValores.length && p < parcelasRoyaltiesCount; p++) {
            var idxValor = royaltiesValores[p];
            var codigoBarras = '';
            if (royaltiesBarras[p] < valores.length) {
                codigoBarras = String(valores[royaltiesBarras[p]] || '').trim();
                if (codigoBarras === 'Nenhum' || codigoBarras === '') codigoBarras = '';
            }
            var valorRaw = idxValor < valores.length ? valores[idxValor] : '';
            if (valorRaw && String(valorRaw) !== 'Nenhum') {
                var info = extrairParcelaInfo(String(valorRaw));
                if (info) {
                    parcelasRoyalties.push({
                        num: p + 1,
                        valor: info.valor,
                        vencimento: info.vencimento,
                        status: info.status,
                        codigoPix: '',
                        codigoBarras: codigoBarras
                    });
                }
            }
        }
        
        var parcelasPropagandaCount = 0;
        if (valores[idxPropagandaParcelas]) {
            var match = String(valores[idxPropagandaParcelas]).match(/(\d+)x/);
            if (match) parcelasPropagandaCount = parseInt(match[1]);
        }
        for (var p = 0; p < propagandaValores.length && p < parcelasPropagandaCount; p++) {
            var idxValor = propagandaValores[p];
            var codigoBarras = '';
            if (propagandaBarras[p] < valores.length) {
                codigoBarras = String(valores[propagandaBarras[p]] || '').trim();
                if (codigoBarras === 'Nenhum' || codigoBarras === '') codigoBarras = '';
            }
            var valorRaw = idxValor < valores.length ? valores[idxValor] : '';
            if (valorRaw && String(valorRaw) !== 'Nenhum') {
                var info = extrairParcelaInfo(String(valorRaw));
                if (info) {
                    parcelasPropaganda.push({
                        num: p + 1,
                        valor: info.valor,
                        vencimento: info.vencimento,
                        status: info.status,
                        codigoPix: '',
                        codigoBarras: codigoBarras
                    });
                }
            }
        }
        
        var valorPendente = 0;
        var allParcelas = parcelasProduto.concat(parcelasRoyalties).concat(parcelasPropaganda);
        allParcelas.forEach(function(p) {
            if (p.status !== 'Pagos') valorPendente += p.valor;
        });
        
        var dataEmissaoFinal = dataEmissao;
        if (dataEmissaoFinal && dataEmissaoFinal !== 'Sem Data') {
            var partes = dataEmissaoFinal.split('/');
            if (partes.length === 3) dataEmissaoFinal = partes[2] + '-' + partes[1] + '-' + partes[0];
        }
        
        pedidos.push({
            pedido: pedidoId,
            dataEmissao: dataEmissaoFinal,
            notaFiscal: String(valores[idxNF] || '').trim() || 'N/A',
            valorTotal: valorTotal,
            valorProdutos: valorProdutos,
            valorRoyalties: valorRoyaltiesVal,
            valorPropaganda: valorPropagandaVal,
            totalParcelas: totalParcelas,
            parcelasProdutoCount: parcelasProdutoCount,
            parcelasRoyaltiesCount: parcelasRoyaltiesCount,
            parcelasPropagandaCount: parcelasPropagandaCount,
            parcelasProduto: parcelasProduto,
            parcelasRoyalties: parcelasRoyalties,
            parcelasPropaganda: parcelasPropaganda,
            valorPendente: valorPendente,
            totalmentePago: valorPendente === 0,
            emProcessamento: false,
            isSemData: false
        });
    }
    return pedidos;
}

function processarDadosProdutos(data) {
    if (!data || data.length < 2) {
        produtosData = [];
        produtosPorPedido = {};
        window.produtosData = [];
        return;
    }
    
    var idxPedido = 0, idxData = 1, idxNotaFiscal = 2, idxPrecoCompra = 3;
    var idxProdutosUnicos = 8, idxTotalProdutos = 9;
    var idxCodigo = 10, idxProduto = 11, idxQuantidade = 12, idxPontos = 13;
    var idxValorUnit = 14, idxValorTotal = 15, idxVendaUnit = 16, idxVendaTotal = 17;
    var idxLucro = 18, idxLucroPercentual = 19, idxLucroReal = 20, idxLucroRealPercentual = 21;
    var idxReferencia = 22;
    
    var pedidoAtual = null;
    produtosPorPedido = {};
    
    for (var i = 1; i < data.length; i++) {
        var row = data[i];
        if (row.length < 10) continue;
        
        var pedido = String(row[idxPedido] || '').trim();
        if (pedido === '' || pedido === 'Pedido') {
            pedido = pedidoAtual;
        } else {
            pedidoAtual = pedido;
        }
        if (!pedido || pedido === 'Pedido') continue;
        
        if (!produtosPorPedido[pedido]) {
            produtosPorPedido[pedido] = {
                pedido: pedido,
                data: String(row[idxData] || '').trim(),
                notaFiscal: String(row[idxNotaFiscal] || '').trim(),
                precoCompra: limparValorProduto(String(row[idxPrecoCompra] || '0')),
                valorVendaTotal: 0,
                lucroTotal: 0,
                totalPontos: 0,
                produtosIndisponiveis: 0,
                linhas: []
            };
        }
        
        var codigo = row.length > idxCodigo ? String(row[idxCodigo] || '').trim() : '';
        var produto = row.length > idxProduto ? String(row[idxProduto] || '').trim() : '';
        var quantidade = row.length > idxQuantidade ? String(row[idxQuantidade] || '0').trim() : '0';
        var pontos = row.length > idxPontos ? parseInt(String(row[idxPontos] || '0').replace(/\./g, '').trim()) || 0 : 0;
        var valorUnit = row.length > idxValorUnit ? limparValorProduto(String(row[idxValorUnit] || '0')) : 0;
        var valorTotal = row.length > idxValorTotal ? limparValorProduto(String(row[idxValorTotal] || '0')) : 0;
        var vendaUnit = row.length > idxVendaUnit ? limparValorProduto(String(row[idxVendaUnit] || '0')) : 0;
        var vendaTotal = row.length > idxVendaTotal ? limparValorProduto(String(row[idxVendaTotal] || '0')) : 0;
        var lucro = row.length > idxLucro ? limparValorProduto(String(row[idxLucro] || '0')) : 0;
        var lucroPercentual = row.length > idxLucroPercentual ? limparValorProduto(String(row[idxLucroPercentual] || '0')) : 0;
        var referencia = row.length > idxReferencia ? String(row[idxReferencia] || '').trim() : '';
        
        var isIndisponivel = referencia.indexOf('Produtos indisponível') !== -1;
        
        produtosPorPedido[pedido].linhas.push({
            linha: i,
            codigo: codigo,
            produto: produto,
            quantidade: quantidade,
            pontos: pontos,
            valorUnit: valorUnit,
            valorTotal: valorTotal,
            vendaUnit: vendaUnit,
            vendaTotal: vendaTotal,
            lucro: lucro,
            lucroPercentual: lucroPercentual,
            referencia: referencia,
            isIndisponivel: isIndisponivel,
            valorCompra: valorUnit,
            valorVenda: vendaUnit
        });
        
        if (!isIndisponivel && vendaTotal > 0) {
            produtosPorPedido[pedido].valorVendaTotal += vendaTotal;
            produtosPorPedido[pedido].lucroTotal += lucro;
            var qtd = parseInt(quantidade) || 0;
            produtosPorPedido[pedido].totalPontos += pontos;
        }
        if (isIndisponivel) {
            produtosPorPedido[pedido].produtosIndisponiveis++;
        }
    }
    
    produtosData = Object.values(produtosPorPedido).map(function(p) {
        var produtosUnicos = 0, totalProdutos = 0, totalPontos = 0, produtosIndisponiveis = 0, precoVenda = 0;
        for (var item of p.linhas) {
            if (item.isIndisponivel) { produtosIndisponiveis++; continue; }
            if (item.vendaTotal === 0) break;
            var qtd = parseInt(item.quantidade) || 0;
            if (qtd > 0) {
                produtosUnicos++;
                totalProdutos += qtd;
                totalPontos += item.pontos;
                precoVenda += (item.vendaUnit || 0) * qtd;
            }
        }
        var lucroTotal = precoVenda - p.precoCompra;
        var lucroPercentual = p.precoCompra > 0 ? (lucroTotal / p.precoCompra) * 100 : 0;
        return {
            pedido: p.pedido,
            data: p.data,
            notaFiscal: p.notaFiscal,
            precoCompra: p.precoCompra,
            linhas: p.linhas,
            produtosUnicos: produtosUnicos,
            totalProdutos: totalProdutos,
            totalPontos: totalPontos,
            produtosIndisponiveis: produtosIndisponiveis,
            precoVenda: precoVenda,
            lucroTotal: lucroTotal,
            lucroPercentual: lucroPercentual
        };
    });
    
    window.produtosData = produtosData;
    window.produtosPorPedido = produtosPorPedido;
    console.log('📊 ' + produtosData.length + ' pedidos carregados da aba Produtos');
}

// ============================================================
// CALCULAR TOTAIS
// ============================================================

function calcularTotais(pedidos) {
    var totalPendente = 0, totalPago = 0, totalGeral = 0;
    pedidos.forEach(function(p) {
        if (p.emProcessamento) return;
        totalGeral += p.valorTotal;
        var totalParcelasExtraidas = 0;
        var totalParcelasPagas = 0;
        
        p.parcelasProduto.forEach(function(parc) {
            totalParcelasExtraidas += parc.valor;
            if (parc.status === 'Pagos' || isPago(p.pedido, parc.num, 'produto')) {
                totalParcelasPagas += parc.valor;
            }
        });
        p.parcelasRoyalties.forEach(function(parc) {
            totalParcelasExtraidas += parc.valor;
            if (parc.status === 'Pagos' || isPago(p.pedido, parc.num, 'royalties')) {
                totalParcelasPagas += parc.valor;
            }
        });
        p.parcelasPropaganda.forEach(function(parc) {
            totalParcelasExtraidas += parc.valor;
            if (parc.status === 'Pagos' || isPago(p.pedido, parc.num, 'propaganda')) {
                totalParcelasPagas += parc.valor;
            }
        });
        
        if (totalParcelasExtraidas === 0) {
            totalPago += p.valorTotal;
        } else if (totalParcelasExtraidas < p.valorTotal) {
            var diferenca = p.valorTotal - totalParcelasExtraidas;
            totalPago += totalParcelasPagas + diferenca;
            totalPendente += (totalParcelasExtraidas - totalParcelasPagas);
        } else {
            totalPago += totalParcelasPagas;
            totalPendente += (totalParcelasExtraidas - totalParcelasPagas);
        }
    });
    return { totalPendente: totalPendente, totalPago: totalPago, totalGeral: totalGeral };
}

function formatarParcelasHTML(parcelas, titulo, tipo, pedidoId) {
    if (!parcelas || parcelas.length === 0) {
        return '<div class="parcela-tipo"><h4>' + titulo + '</h4><p style="color:#999;">Nenhuma parcela</p></div>';
    }
    var html = '<div class="parcela-tipo"><h4>' + titulo + ' (' + parcelas.length + 'x)</h4>';
    parcelas.forEach(function(p) {
        var statusClass = '', statusText = '';
        if (p.status === 'Pagos') { statusClass = 'status-pagos'; statusText = 'Pago'; }
        else if (p.status === 'A vencer') { statusClass = 'status-a-vencer'; statusText = 'A vencer'; }
        else { statusClass = 'status-em-atraso'; statusText = 'Em atraso'; }
        var pagoManual = (p.status === 'Pagos') || isPago(pedidoId, p.num, tipo);
        var classePaga = pagoManual ? 'parcela-paga' : '';
        var checked = pagoManual ? 'checked' : '';
        var labelClass = pagoManual ? 'pago' : 'nao-pago';
        var labelText = pagoManual ? '✅ Pago' : '⏳ Pendente';
        html += '<div class="parcela-item ' + classePaga + '"><strong>Parcela ' + String(p.num).padStart(2, '0') + '</strong><br>Valor: ' + formatarMoedaBR(p.valor) + '<br>Vencimento: ' + p.vencimento + '<br><span class="' + statusClass + '">' + statusText + '</span>';
        if (tipo === 'produto') {
            html += '<div class="codigos-container">';
            if (p.codigoPix) html += '<button class="btn-copiar btn-pix" onclick="copiarTexto(\'' + p.codigoPix.replace(/'/g, "\\'") + '\')">PIX</button>';
            if (p.codigoBarras) html += '<button class="btn-copiar btn-barras" onclick="copiarTexto(\'' + p.codigoBarras.replace(/'/g, "\\'") + '\')">Cód. Barras</button>';
            html += '</div>';
        }
        if (tipo === 'royalties' || tipo === 'propaganda') {
            if (p.codigoBarras) {
                html += '<div class="codigos-container"><button class="btn-copiar btn-barras" onclick="copiarTexto(\'' + p.codigoBarras.replace(/'/g, "\\'") + '\')">Cód. Barras</button></div>';
            }
        }
        var chave = pedidoId + '_' + p.num + '_' + tipo;
        html += '<div class="codigos-container" style="margin-top: 6px;"><label class="pagamento-checkbox ' + labelClass + '" onclick="event.stopPropagation();"><input type="checkbox" data-id="' + chave + '" ' + checked + ' onchange="handlePagamentoChange(\'' + pedidoId + '\', ' + p.num + ', \'' + tipo + '\', this.checked)"><span>' + labelText + '</span></label></div>';
        html += '</div>';
    });
    html += '</div>';
    return html;
}

async function handlePagamentoChange(pedidoId, parcelaId, tipo, pago) {
    var chave = pedidoId + '_' + parcelaId + '_' + tipo;
    var checkbox = document.querySelector('input[data-id="' + chave + '"]');
    if (checkbox) {
        var label = checkbox.closest('.pagamento-checkbox');
        var span = label.querySelector('span');
        if (pago) {
            label.classList.add('pago');
            label.classList.remove('nao-pago');
            span.textContent = '✅ Pago';
        } else {
            label.classList.add('nao-pago');
            label.classList.remove('pago');
            span.textContent = '⏳ Pendente';
        }
        var parcelaItem = checkbox.closest('.parcela-item');
        if (parcelaItem) {
            if (pago) parcelaItem.classList.add('pago');
            else parcelaItem.classList.remove('pago');
        }
    }
    var salvo = await salvarPagamentoBackend(pedidoId, parcelaId, tipo, pago);
    var statusMsg = document.getElementById('statusSalvo');
    if (statusMsg) {
        if (salvo) {
            statusMsg.textContent = '✅ Pagamento salvo no servidor!';
            statusMsg.style.color = '#28a745';
        } else {
            statusMsg.textContent = '⚠️ Salvo localmente (offline)';
            statusMsg.style.color = '#e67e22';
        }
        setTimeout(function() { statusMsg.textContent = ''; }, 3000);
    }
    if (modoVisualizacao === 'boletos') {
        var activeSubmenu = document.querySelector('.btn-submenu.active');
        if (activeSubmenu) {
            var text = activeSubmenu.textContent.trim();
            if (text.indexOf('semana') !== -1) mostrarBoletosSemana();
            else if (text.indexOf('mês') !== -1) mostrarBoletosMes();
            else if (text.indexOf('Atrasados') !== -1) mostrarBoletosAtrasados();
            else if (text.indexOf('Próxima semana') !== -1) mostrarBoletosProximaSemana();
            else if (text.indexOf('Próximo mês') !== -1) mostrarBoletosProximoMes();
        }
    }
}

function toggleMesAcordion(mesId) {
    var body = document.getElementById('body-' + mesId);
    var icon = document.getElementById('icon-' + mesId);
    var header = body ? body.previousElementSibling : null;
    if (!body) return;
    if (body.classList.contains('show')) {
        body.classList.remove('show');
        icon.textContent = '▼';
        if (header) header.classList.remove('active');
    } else {
        body.classList.add('show');
        icon.textContent = '▲';
        if (header) header.classList.add('active');
    }
}

        icon.textContent = '▼';

}

function baixarBoletosPagosDoMes(mesAno) {
    var partes = mesAno.split('/');
    var mes = parseInt(partes[0]);
    var ano = parseInt(partes[1]);
    var boletosPagos = [];
    pedidosData.forEach(function(p) {
        var processarParcelas = function(parcelas, tipo) {
            parcelas.forEach(function(parc) {
                if (parc.status === 'Pagos' || isPago(p.pedido, parc.num, tipo)) {
                    var dataParc = dataParaComparacao(parc.vencimento);
                    if (dataParc.getMonth() + 1 === mes && dataParc.getFullYear() === ano) {
                        boletosPagos.push({ dia: dataParc.getDate(), valor: parc.valor, tipo: tipo });
                    }
                }
            });
        };
        processarParcelas(p.parcelasProduto, 'produto');
        processarParcelas(p.parcelasRoyalties, 'royalties');
        processarParcelas(p.parcelasPropaganda, 'propaganda');
    });
    if (boletosPagos.length === 0) {
        alert('Nenhum boleto pago encontrado para este mês.');
        return;
    }
    var ultimoDia = new Date(ano, mes, 0).getDate();
    var dias = {};
    for (var d = 1; d <= ultimoDia; d++) {
        dias[d] = { produto: 0, royalties: 0, propaganda: 0 };
    }
    boletosPagos.forEach(function(b) {
        if (b.tipo === 'produto') dias[b.dia].produto += b.valor;
        else if (b.tipo === 'royalties') dias[b.dia].royalties += b.valor;
        else if (b.tipo === 'propaganda') dias[b.dia].propaganda += b.valor;
    });
    var meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    var nomeMes = meses[mes - 1];
    var linha1 = '';
    for (var d = 1; d <= ultimoDia; d++) {
        linha1 += ';' + String(d).padStart(2, '0') + '/' + nomeMes;
    }
    var linha2 = 'Produtos = Natura';
    for (var d = 1; d <= ultimoDia; d++) {
        linha2 += ';' + (Math.round(dias[d].produto)).toFixed(2).replace('.', ',');
    }
    var linha3 = 'Produtos = Outras Marcas';
    for (var d = 1; d <= ultimoDia; d++) {
        linha3 += ';';
    }
    var linha4 = 'Royalties';
    for (var d = 1; d <= ultimoDia; d++) {
        linha4 += ';' + (Math.round(dias[d].royalties)).toFixed(2).replace('.', ',');
    }
    var linha5 = 'Fundo de Propaganda';
    for (var d = 1; d <= ultimoDia; d++) {
        linha5 += ';' + (Math.round(dias[d].propaganda)).toFixed(2).replace('.', ',');
    }
    var csvContent = [linha1, linha2, linha3, linha4, linha5].join('\n');
    var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.download = 'boletos_pagos_' + mesAno.replace('/', '_') + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showNotification('✅ Arquivo baixado: boletos_pagos_' + mesAno.replace('/', '_') + '.csv', 'success');
}

        if (table && !jaAplicou) {
            var ths = table.querySelectorAll('thead th');
            if (ths.length > 0) {
                jaAplicou = true;
                aplicarStickyDireto();
                clearInterval(intervalo);
                return;
            }
        }
        if (tentativas >= maxTentativas) {
            if (!jaAplicou) { jaAplicou = true; aplicarStickyDireto(); }
            clearInterval(intervalo);
        }
    }, 200);
}

// ============================================================

function aplicarStickyDireto() {
    var tabela = document.querySelector('#tableWrapper table');
    if (!tabela) return;
    
    var el = tabela.parentElement;
    while (el) {
        el.style.overflow = 'visible';
        el.style.overflowX = 'visible';
        el.style.overflowY = 'visible';
        el = el.parentElement;
        if (el === document.body) break;
    }
    var ths = tabela.querySelectorAll('thead th');
    ths.forEach(function(th) {
        th.style.position = 'sticky';
        th.style.top = '0';
        th.style.zIndex = '9999';
        th.style.background = '#1f5e7e';
        th.style.color = '#ffffff';
    });
    var thead = tabela.querySelector('thead');
    if (thead) thead.style.position = 'static';
    var tr = tabela.querySelector('thead tr');
    if (tr) tr.style.position = 'static';
    
    var detailCards = document.querySelectorAll('.detail-card');
    detailCards.forEach(function(card) {
        var tabelas = card.querySelectorAll('table');
        tabelas.forEach(function(tbl) {
            var thsDetalhe = tbl.querySelectorAll('th');
            if (thsDetalhe.length > 0) {
                var temPedido = false;
                thsDetalhe.forEach(function(th) {
                    if (th.textContent.indexOf('Pedido') !== -1) temPedido = true;
                });
                if (temPedido && thsDetalhe.length >= 8) {
                    thsDetalhe.forEach(function(th) {
                        th.style.position = 'sticky';
                        th.style.top = '42px';
                        th.style.zIndex = '9998';
                        th.style.background = '#3d9a8c';
                        th.style.color = '#ffffff';
                        th.style.borderBottom = '0px solid #2c6f96';
                        th.style.fontWeight = '600';
                    });
                }
            }
        });
    });
}

function aplicarStickyEmTodosDetalhes() {
    var detailRows = document.querySelectorAll('.parcelas-detail.show');
    var aplicados = 0;
    detailRows.forEach(function(row, index) {
        var tabelas = row.querySelectorAll('table');
        tabelas.forEach(function(tabela) {
            var ths = tabela.querySelectorAll('thead th');
            if (ths.length === 0) return;
            var isProdutoTable = false;
            var temCodigo = false, temProduto = false, temQtd = false;
            ths.forEach(function(th) {
                var texto = th.textContent.trim();
                if (texto === 'Código' || texto.indexOf('Código') !== -1) temCodigo = true;
                if (texto === 'Produto' || texto.indexOf('Produto') !== -1) temProduto = true;
                if (texto === 'Qtd' || texto.indexOf('Qtd') !== -1) temQtd = true;
            });
            if (temCodigo && temProduto && temQtd) isProdutoTable = true;
            if (isProdutoTable) {
                var parent = tabela.parentElement;
                while (parent && parent !== document.body) {
                    parent.style.overflow = 'visible';
                    parent.style.overflowX = 'visible';
                    parent.style.overflowY = 'visible';
                    parent = parent.parentElement;
                }
                ths.forEach(function(th) {
                    var align = th.style.textAlign || 'left';
                    th.style.position = 'sticky';
                    th.style.top = '42px';
                    th.style.zIndex = '9998';
                    th.style.background = '#3d9a8c';
                    th.style.color = '#ffffff';
                    th.style.borderBottom = '1px solid #2c6f96';
                    th.style.fontWeight = '600';
                    th.style.padding = '6px 8px';
                    th.style.textAlign = align;
                });
                var thead = tabela.querySelector('thead');
                if (thead) thead.style.position = 'static';
                var tr = tabela.querySelector('thead tr');
                if (tr) tr.style.position = 'static';
                aplicados++;
            }
        });
    });
    if (aplicados > 0) console.log('✅ Sticky aplicado em ' + aplicados + ' detalhes');
}

    }
    
    if (tableWrapper) {
        tableWrapper.innerHTML = '<div style="text-align:center; padding:40px; color:#667;"><div class="loading" style="display:block;">⏳ Carregando dados de produtos...</div></div>';
    }
    
    if (!produtosData || produtosData.length === 0) {
        carregarProdutos().then(function() {
            window.produtosDataFiltrados = produtosData;
            renderizarTabelaProdutosComFiltro(produtosData);
        }).catch(function(err) {
            if (tableWrapper) {
                tableWrapper.innerHTML = '<div style="text-align:center; padding:40px; color:#dc3545;">❌ Erro ao carregar produtos: ' + err.message + '<br><br><button onclick="mostrarProdutosPorPedido()" class="btn" style="background:#28a745;">Tentar novamente</button></div>';
            }
        });
        return;
    }
    
    var periodo = window.periodoAtualProdutosPorPedido || 'todo';
    var dataLimite = null;
    var agora = new Date();
    if (periodo === 'mes') { dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1); }
    else if (periodo === '3meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 3); }
    else if (periodo === '5meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 5); }
    else if (periodo === '8meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 8); }
    else if (periodo === '12meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 12); }
    
    var produtosFiltrados = produtosData;
    if (dataLimite) {
        produtosFiltrados = produtosData.filter(function(p) {
            var dataPedido = new Date(p.data.split('/').reverse().join('/'));
            return dataPedido >= dataLimite;
        });
    }
    window.produtosDataFiltrados = produtosFiltrados;
    if (produtosFiltrados && produtosFiltrados.length > 0) {
        renderizarTabelaProdutosComFiltro(produtosFiltrados);
    } else if (tableWrapper) {
        tableWrapper.innerHTML = '<div style="text-align:center; padding:40px; color:#667;">📦 Nenhum dado de produto encontrado no período selecionado.<br><br><button onclick="filtrarProdutosPorPedido(\'todo\')" class="btn" style="background:#28a745;">Ver todos</button></div>';
    }
}

function renderizarTabelaProdutosComFiltro(produtosFiltrados) {
    var container = document.getElementById('tableWrapper');
    if (!container) return;
    if (!produtosFiltrados || produtosFiltrados.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:#667;">📦 Nenhum dado de produto encontrado no período selecionado.</div>';
        return;
    }
    
    var dadosParaRender = produtosFiltrados.slice().sort(function(a, b) {
        var dataA = new Date(a.data.split('/').reverse().join('/'));
        var dataB = new Date(b.data.split('/').reverse().join('/'));
        return dataB - dataA;
    });
    
    var colunaAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.coluna : null;
    var ordemAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.ordem : 'asc';
    
    var colunas = [
        { key: 'pedido', label: 'Pedido', align: 'left' },
        { key: 'data', label: 'Data', align: 'left' },
        { key: 'produtosUnicos', label: 'Produtos Únicos', align: 'center' },
        { key: 'quantidadeTotal', label: 'Quantidade Total', align: 'center' },
        { key: 'pontos', label: 'Pontos', align: 'center' },
        { key: 'precoCompra', label: 'Preço de Compra', align: 'right' },
        { key: 'precoVenda', label: 'Preço de Venda', align: 'right' },
        { key: 'lucro', label: 'Lucro (R$)', align: 'right' },
        { key: 'lucroPercentual', label: 'Lucro (%)', align: 'right' },

    ];

    }

    for (var i = 0; i < dadosParaRender.length; i++) {

        if (p.linhas) {
            for (var l = 0; l < p.linhas.length; l++) {

                precoVenda += (item.vendaUnit || 0) * qtd;
            }
        }
        var lucroTotal = precoVenda - precoCompra;

        var pedidoId = p.pedido;

.toLocaleString('pt-BR') + '</small></div></td></tr>';
    }
    html += '</tbody></table></div>';
    container.innerHTML = html;
    atualizarSetasCabecalho();
    setTimeout(aplicarEstiloCompactoProdutos, 100);
}

function atualizarSetasCabecalho() {
    var colunaAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.coluna : null;
    var ordemAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.ordem : 'asc';
    var headers = document.querySelectorAll('#tableWrapper thead th');
    headers.forEach(function(th) {
        var coluna = th.getAttribute('data-coluna');
        if (!coluna) return;
        var textoOriginal = th.getAttribute('data-texto-original');
        if (!textoOriginal) {
            textoOriginal = th.textContent.replace(/[▲▼▾▴]/g, '').trim();
            th.setAttribute('data-texto-original', textoOriginal);
        }
        var isAtiva = coluna === colunaAtiva;
        th.textContent = textoOriginal;
        var setaSpan = document.createElement('span');
        var seta = isAtiva ? (ordemAtiva === 'asc' ? ' ▲' : ' ▼') : ' ▾';
        setaSpan.textContent = seta;
        setaSpan.style.marginLeft = '2px';
        if (isAtiva) {
            setaSpan.style.color = '#0b4f6c';
            setaSpan.style.fontWeight = 'bold';
            th.style.background = '#e3f2fd';
            th.style.color = '#0b4f6c';
            th.style.fontWeight = 'bold';
        } else {
            setaSpan.style.color = 'rgba(255,255,255,0.6)';
            setaSpan.style.fontWeight = 'normal';
            th.style.background = '#1f5e7e';
            th.style.color = '#ffffff';
            th.style.fontWeight = 'normal';
        }
        th.appendChild(setaSpan);
        th.style.borderBottom = 'none';
        th.style.border = 'none';
    });
}

function ordenarProdutosPorPedido(coluna) {
    if (window.ordenacaoProdutosPorPedido.coluna === coluna) {
        window.ordenacaoProdutosPorPedido.ordem = window.ordenacaoProdutosPorPedido.ordem === 'asc' ? 'desc' : 'asc';
    } else {
        window.ordenacaoProdutosPorPedido.coluna = coluna;
        window.ordenacaoProdutosPorPedido.ordem = 'asc';
    }
    var ordem = window.ordenacaoProdutosPorPedido.ordem;
    var colunaIndex = { 'pedido': 0, 'data': 1, 'produtosUnicos': 2, 'quantidadeTotal': 3, 'pontos': 4, 'precoCompra': 5, 'precoVenda': 6, 'lucro': 7, 'lucroPercentual': 8, 'indisponiveis': 9 };
    var idx = colunaIndex[coluna];
    if (idx === undefined) return;
    var tbody = document.getElementById('tableBody');
    if (!tbody) return;
    var rows = Array.from(tbody.querySelectorAll('tr.pedido-row'));
    if (rows.length === 0) return;
    var rowsComDetalhes = rows.map(function(row) {
        var pedidoId = row.querySelector('td') ? row.querySelector('td').textContent.replace('▶', '').replace('▼', '').trim() : null;
        var detalheRow = pedidoId ? document.getElementById('detalhe-produtos-' + pedidoId) : null;
        return { row: row, detalheRow: detalheRow, pedidoId: pedidoId };
    });
    rowsComDetalhes.sort(function(a, b) {
        var cellsA = a.row.querySelectorAll('td');
        var cellsB = b.row.querySelectorAll('td');
        if (cellsA.length <= idx || cellsB.length <= idx) return 0;
        var valA = cellsA[idx].textContent.trim();
        var valB = cellsB[idx].textContent.trim();
        if (coluna === 'precoCompra' || coluna === 'precoVenda' || coluna === 'lucro' || coluna === 'lucroPercentual') {
            valA = parseFloat(valA.replace(/[R$\s.,]/g, '').replace(',', '.')) || 0;
            valB = parseFloat(valB.replace(/[R$\s.,]/g, '').replace(',', '.')) || 0;
        } else if (coluna === 'produtosUnicos' || coluna === 'quantidadeTotal' || coluna === 'pontos' || coluna === 'indisponiveis') {
            valA = parseInt(valA) || 0;
            valB = parseInt(valB) || 0;
        } else if (coluna === 'data') {
            var partesA = valA.split('/'), partesB = valB.split('/');
            if (partesA.length === 3 && partesB.length === 3) {
                valA = new Date(partesA[2], partesA[1] - 1, partesA[0]).getTime();
                valB = new Date(partesB[2], partesB[1] - 1, partesB[0]).getTime();
            }
        } else {
            valA = valA.toLowerCase();
            valB = valB.toLowerCase();
        }
        if (valA < valB) return ordem === 'asc' ? -1 : 1;
        if (valA > valB) return ordem === 'asc' ? 1 : -1;
        return 0;
    });
    rowsComDetalhes.forEach(function(item) {
        tbody.appendChild(item.row);
        if (item.detalheRow) tbody.appendChild(item.detalheRow);
    });
    atualizarSetasCabecalho();
}

function filtrarProdutosPorPedido(periodo) {
    var botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
    botoes.forEach(function(b) { b.classList.remove('active'); });
    var periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
    botoes.forEach(function(b) {
        if (b.textContent.trim() === periodos[periodo]) b.classList.add('active');
    });
    window.periodoAtualProdutosPorPedido = periodo;
    mostrarProdutosPorPedido();
}

function toggleDetalhesProdutos(pedidoId) {
    var row = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!row) return;
    row.classList.toggle('show');
    var icon = row.previousElementSibling.querySelector('.expand-icon');
    if (icon) icon.innerHTML = row.classList.contains('show') ? '▼' : '▶';
    if (row.classList.contains('show')) carregarProdutosDetalhados(pedidoId);
}

async function carregarProdutosDetalhados(pedidoId) {
    var tbody = document.getElementById('produtos-detalhe-' + pedidoId);
    if (!tbody) return;
    if (tbody.querySelector('tr') && tbody.querySelector('tr').textContent !== 'Carregando produtos...') return;
    
    try {
        var response = await fetch(API_BASE_URL + '/api/sheet-data?sheet=Produtos', {
            method: 'GET',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var result = await response.json();
        if (!result.success || !result.data) throw new Error('Erro ao buscar produtos');
        var data = result.data;
        
        var idxPedido = 0, idxCodigo = 10, idxProduto = 11, idxQuantidade = 12, idxPontos = 13;
        var idxValorUnit = 14, idxValorTotal = 15, idxVendaUnit = 16, idxVendaTotal = 17;
        var idxLucro = 18, idxLucroPercentual = 19, idxLucroReal = 20, idxLucroRealPercentual = 21, idxReferencia = 22;
        
        var linhasPedido = [], pedidoAtual = null;
        for (var i = 1; i < data.length; i++) {
            var row = data[i];
            if (row.length < 10) continue;
            var pedido = String(row[idxPedido] || '').trim();
            if (pedido === '' || pedido === 'Pedido') pedido = pedidoAtual;
            else pedidoAtual = pedido;
            if (pedido === pedidoId) {
                var codigo = String(row[idxCodigo] || '').trim();

            tbody.innerHTML = '<tr><td colspan="13" style="text-align:center; padding:20px; color:#999;">Nenhum produto encontrado para este pedido.</td></tr>';
            return;
        }
        
        var disponiveis = [], indisponiveis = [];
        for (var l = 0; l < linhasPedido.length; l++) {
            var row = linhasPedido[l];
            var referencia = String(row[idxReferencia] || '').trim();
            if (referencia.indexOf('Produtos indisponível') !== -1) indisponiveis.push(row);
            else disponiveis.push(row);
        }
        
        var contagemProdutos = {};
        for (var d = 0; d < disponiveis.length; d++) {
            var row = disponiveis[d];
            var codigo = String(row[idxCodigo] || '').trim();
            var vendaUnit = limparValorProduto(String(row[idxVendaUnit] || '0'));
            var chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            contagemProdutos[chave] = (contagemProdutos[chave] || 0) + 1;
        }
        
        var produtosAgrupados = {}, produtosOriginal = [];
        for (var d = 0; d < disponiveis.length; d++) {
            var row = disponiveis[d];
            var codigo = String(row[idxCodigo] || '').trim();
            var vendaUnit = limparValorProduto(String(row[idxVendaUnit] || '0'));
            var chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            var temRepeticao = contagemProdutos[chave] > 1;
            if (!produtosAgrupados[chave]) {
                produtosAgrupados[chave] = {
                    codigo: codigo,
                    produto: String(row[idxProduto] || '').trim(),
                    vendaUnit: vendaUnit,
                    quantidadeTotal: 0,
                    valorCompraTotal: 0,
                    pontosTotal: 0,
                    lucroTotal: 0,
                    lucroPercentualTotal: 0,
                    referencia: String(row[idxReferencia] || '').trim(),
                    lucroReal: 0,
                    lucroRealPercentual: 0,
                    maiorValorUnit: 0,
                    referenciaMaiorValor: '',
                    lucroPercentualDescMaior: 0,
                    lucroRealDescMaior: 0,
                    itens: [],
                    temRepeticao: temRepeticao
                };
            }
            var qtd = parseInt(String(row[idxQuantidade] || '0').trim()) || 0;
            var valorUnit = limparValorProduto(String(row[idxValorUnit] || '0'));
            var pontos = parseInt(String(row[idxPontos] || '0').replace(/\./g, '').trim()) || 0;
            var lucro = limparValorProduto(String(row[idxLucro] || '0'));
            var lucroPercentual = limparValorProduto(String(row[idxLucroPercentual] || '0'));
            var lucroReal = limparValorProduto(String(row[idxLucroReal] || '0'));
            var lucroRealPercentual = limparValorProduto(String(row[idxLucroRealPercentual] || '0'));
            var referencia = String(row[idxReferencia] || '').trim();
            produtosAgrupados[chave].quantidadeTotal += qtd;
            produtosAgrupados[chave].valorCompraTotal += valorUnit * qtd;
            produtosAgrupados[chave].pontosTotal += pontos;
            produtosAgrupados[chave].lucroTotal += lucro;
            produtosAgrupados[chave].lucroPercentualTotal += lucroPercentual;
            produtosAgrupados[chave].itens.push({ qtd: qtd, valorUnit: valorUnit, pontos: pontos, lucro: lucro, lucroPercentual: lucroPercentual });

function calcularProdutosMaisPedidos(periodo) {
    var dataLimite = null;
    var agora = new Date();
    if (periodo === 'mes') dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    else if (periodo === '3meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 3); }
    else if (periodo === '5meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 5); }
    else if (periodo === '8meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 8); }
    else if (periodo === '12meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 12); }
    
    var produtos = {}, totalPedidos = 0;
    for (var p = 0; p < produtosData.length; p++) {
        var pedido = produtosData[p];
        if (dataLimite) {
            var dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        totalPedidos++;
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        var produtosDoPedido = {};
        for (var l = 0; l < pedido.linhas.length; l++) {
            var linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            var codigo = linha.codigo;
            if (!codigo) continue;
            var vendaUnit = linha.vendaUnit || 0;
            var chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            if (!produtosDoPedido[chave]) {
                produtosDoPedido[chave] = { codigo: codigo, produto: linha.produto, vendaUnit: vendaUnit, quantidadeTotal: 0, valorCompraTotal: 0, items: [] };
            }
            var qtd = parseInt(linha.quantidade) || 0;
            var valorUnit = linha.valorUnit || 0;
            produtosDoPedido[chave].quantidadeTotal += qtd;
            produtosDoPedido[chave].valorCompraTotal += valorUnit * qtd;
            produtosDoPedido[chave].items.push({ quantidade: qtd, valorUnit: valorUnit });
        }
        for (var chave in produtosDoPedido) {
            var item = produtosDoPedido[chave];
            var codigo = item.codigo;
            var valorCompraMedio = item.quantidadeTotal > 0 ? item.valorCompraTotal / item.quantidadeTotal : 0;
            var lucroUni = item.vendaUnit - valorCompraMedio;
            var lucroPercentual = valorCompraMedio > 0 ? (lucroUni / valorCompraMedio) * 100 : 0;
            if (!produtos[codigo]) {
                produtos[codigo] = { codigo: codigo, produto: item.produto, vezes: 0, quantidadeTotal: 0, valoresCompra: [], valoresVenda: [], lucros: [], lucrosPercentuais: [], pedidos: [] };
            }
            produtos[codigo].vezes++;
            produtos[codigo].quantidadeTotal += item.quantidadeTotal;
            if (valorCompraMedio > 0) produtos[codigo].valoresCompra.push(valorCompraMedio);
            if (item.vendaUnit > 0) produtos[codigo].valoresVenda.push(item.vendaUnit);
            if (lucroUni > 0) produtos[codigo].lucros.push(lucroUni);
            if (lucroPercentual > 0) produtos[codigo].lucrosPercentuais.push(lucroPercentual);
            produtos[codigo].pedidos.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidade: item.quantidadeTotal,
                valorCompra: valorCompraMedio,
                valorVenda: item.vendaUnit,
                lucroUni: lucroUni,
                lucroPercentual: lucroPercentual
            });
        }
    }
    var resultados = Object.values(produtos);
    resultados.sort(function(a, b) { return b.quantidadeTotal - a.quantidadeTotal; });
    return resultados;
}

}

function toggleDetalhesProdutosMaisPedidos(codigo) {

    if (icon) icon.innerHTML = row.classList.contains('show') ? '▼' : '▶';
    if (row.classList.contains('show')) {
        var container = document.getElementById('detalhe-pedidos-produto-' + codigo);
        if (!container) return;
        if (container.innerHTML.indexOf('Clique para carregar') === -1 && container.innerHTML.trim() !== '') return;
        var pedidosAgrupados = {};
        for (var p = 0; p < produtosData.length; p++) {
            var pedido = produtosData[p];
            if (!pedido.linhas) continue;
            var pedidoKey = pedido.pedido;
            if (!pedidosAgrupados[pedidoKey]) {

            }

                    pedidosAgrupados[pedidoKey].valorVenda = vendaUnit;
                }
            }

        for (var pedidoKey in pedidosAgrupados) {
            var item = pedidosAgrupados[pedidoKey];
            if (item.quantidadeTotal === 0) continue;
            temPedidos = true;
            var valorCompraMedio = item.valorCompraTotal / item.quantidadeTotal;
            var valorCompraTotal = item.valorCompraTotal;
            var valorVendaTotal = item.valorVenda * item.quantidadeTotal;
            var lucroUni = item.valorVenda - valorCompraMedio;
            var lucroTotal = lucroUni * item.quantidadeTotal;

function organizarMaisPedidos(tipo) {
    var btnVezes = document.getElementById('btn-organizar-vezes');
    var btnQuantidade = document.getElementById('btn-organizar-quantidade');
    if (btnVezes) btnVezes.classList.remove('active');
    if (btnQuantidade) btnQuantidade.classList.remove('active');
    if (tipo === 'vezes') {
        if (btnVezes) btnVezes.classList.add('active');
        window.organizacaoAtualMaisPedidos = 'vezes';
    } else {
        if (btnQuantidade) btnQuantidade.classList.add('active');
        window.organizacaoAtualMaisPedidos = 'quantidade';
    }
    var produtos = calcularProdutosMaisPedidos(window.periodoAtualMaisPedidos || 'todo');
    var periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
    var titulo = '📈 Produtos mais pedidos - ' + (periodos[window.periodoAtualMaisPedidos || 'todo']);
    renderizarMaisPedidos(produtos, titulo, tipo);
    setTimeout(aplicarEstiloCompactoProdutos, 100);
}

function filtrarMaisPedidos(periodo) {
    var botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
    botoes.forEach(function(b) { b.classList.remove('active'); });
    var periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
    botoes.forEach(function(b) {
        if (b.textContent.trim() === periodos[periodo]) b.classList.add('active');
    });
    window.periodoAtualMaisPedidos = periodo;
    var produtos = calcularProdutosMaisPedidos(periodo);

function executarBuscaProduto() {
    var input = document.getElementById('inputBuscaProduto');
    if (!input) return;
    var termo = input.value.trim();
    if (termo === '') { mostrarBuscaProdutos(); return; }
    window.termoBusca = termo;
    var periodo = window.periodoBusca || 'todo';
    var produtosEncontrados = buscarProdutosPorTermo(termo, periodo);
    renderizarResultadosBusca(produtosEncontrados, termo, periodo);
}

function buscarProdutosPorTermo(termo, periodo) {
    var dataLimite = null;
    var agora = new Date();
    if (periodo === 'mes') dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    else if (periodo === '3meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 3); }
    else if (periodo === '5meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 5); }
    else if (periodo === '8meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 8); }
    else if (periodo === '12meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 12); }
    var produtosMap = {};
    var termoLower = termo.toLowerCase();
    if (typeof produtosData === 'undefined' || produtosData.length === 0) return [];
    for (var p = 0; p < produtosData.length; p++) {
        var pedido = produtosData[p];
        if (dataLimite) {
            var dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        for (var l = 0; l < pedido.linhas.length; l++) {
            var linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            var codigo = (linha.codigo || '').toLowerCase();
            var produto = (linha.produto || '').toLowerCase();
            if (codigo.indexOf(termoLower) !== -1 || produto.indexOf(termoLower) !== -1) {
                var chave = linha.codigo;
                if (!produtosMap[chave]) {
                    var qtd = parseInt(linha.quantidade) || 0;
                    var valorUnit = linha.valorUnit || 0;
                    var vendaUnit = linha.vendaUnit || 0;
                    var lucroUni = vendaUnit - valorUnit;
                    var lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    produtosMap[chave] = {
                        codigo: linha.codigo || '',
                        produto: linha.produto || '',
                        vezes: 1,
                        quantidadeTotal: qtd,
                        valoresCompra: [valorUnit],
                        valoresVenda: [vendaUnit],
                        lucros: [lucroUni],
                        lucrosPercentuais: [lucroPercentual],
                        pedidos: [{ pedido: pedido.pedido, data: pedido.data, quantidade: qtd, valorCompra: valorUnit, valorVenda: vendaUnit, lucroUni: lucroUni, lucroPercentual: lucroPercentual }]
                    };
                } else {
                    var item = produtosMap[chave];
                    var qtd = parseInt(linha.quantidade) || 0;
                    var valorUnit = linha.valorUnit || 0;
                    var vendaUnit = linha.vendaUnit || 0;
                    var lucroUni = vendaUnit - valorUnit;
                    var lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    item.vezes++;
                    item.quantidadeTotal += qtd;
                    item.valoresCompra.push(valorUnit);
                    item.valoresVenda.push(vendaUnit);
                    item.lucros.push(lucroUni);
                    item.lucrosPercentuais.push(lucroPercentual);
                    item.pedidos.push({ pedido: pedido.pedido, data: pedido.data, quantidade: qtd, valorCompra: valorUnit, valorVenda: vendaUnit, lucroUni: lucroUni, lucroPercentual: lucroPercentual });
                }
            }
        }
    }
    var resultados = Object.values(produtosMap);
    resultados.sort(function(a, b) { return b.quantidadeTotal - a.quantidadeTotal; });
    return resultados;
}

function renderizarResultadosBusca(produtos, termo, periodo) {
    var container = document.getElementById('tableWrapper');
    if (!container) return;
    if (produtos.length === 0) {

var originalFetch = window.fetch;
window.fetch = async function() {
    var args = Array.from(arguments);
    try {
        var response = await originalFetch.apply(this, args);
        if (response.status === 401 && currentUser) {
            var url = args[0] || '';
            if (url.indexOf('/api/login') === -1 && url.indexOf('/api/check-auth') === -1) {
                showNotification('⏳ Sessão expirada. Faça login novamente.', 'error');
                setTimeout(function() {
                    if (currentUser) fazerLogout();
                }, 2000);
            }
        }
        return response;
    } catch (error) {
        console.error('Erro no interceptador fetch:', error);
        throw error;
    }
};

function tornarPedidosClicaveis() {
    var detailTables = document.querySelectorAll('.detail-card table');
    var encontrados = 0;
    detailTables.forEach(function(tabela) {
        var rows = tabela.querySelectorAll('tbody tr');
        rows.forEach(function(row) {
            var cells = row.querySelectorAll('td');
            if (cells.length === 0) return;
            var celulaPedido = cells[0];
            var textoPedido = celulaPedido.textContent.trim();
            if (/^\d{9}$/.test(textoPedido) && !celulaPedido.querySelector('a')) {
                var pedidoId = textoPedido;
                var codigoProduto = '';
                var nomeProduto = '';
                var tabelaPai = row.closest('table');
                var cabecalhos = tabelaPai.querySelectorAll('thead th');
                var idxCodigo = -1, idxProduto = -1;
                cabecalhos.forEach(function(th, index) {
                    var texto = th.textContent.trim();
                    if (texto === 'Código' || texto === 'Cód') idxCodigo = index;
                    if (texto === 'Produto' || texto.indexOf('Produto') !== -1) idxProduto = index;
                });
                if (idxCodigo !== -1 && cells[idxCodigo]) codigoProduto = cells[idxCodigo].textContent.trim();
                if (idxProduto !== -1 && cells[idxProduto]) nomeProduto = cells[idxProduto].textContent.trim();
                if (!codigoProduto) {
                    var card = row.closest('.detail-card');
                    if (card) {
                        var titulo = card.querySelector('strong');
                        if (titulo) {
                            var match = titulo.textContent.match(/produto\s*(\d+)/i);
                            if (match) codigoProduto = match[1];
                            var matchNome = titulo.textContent.match(/-\s*(.+?)(?:\s*\(|$)/);
                            if (matchNome) nomeProduto = matchNome[1].trim();
                        }
                    }
                }
                var link = document.createElement('a');
                link.href = '#';
                link.textContent = pedidoId;
                link.style.color = '#0b4f6c';
                link.style.textDecoration = 'underline';
                link.style.cursor = 'pointer';
                link.style.fontWeight = 'bold';
                link.title = 'Ir para o pedido ' + pedidoId + ' em "Produtos por pedido"';
                link.dataset.pedidoId = pedidoId;
                link.dataset.codigoProduto = codigoProduto || '';
                link.dataset.nomeProduto = nomeProduto || '';
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    irParaPedido(this.dataset.pedidoId, this.dataset.codigoProduto, this.dataset.nomeProduto);
                });
                celulaPedido.innerHTML = '';
                celulaPedido.appendChild(link);
                encontrados++;
            }
        });
    });
    if (encontrados > 0) console.log('✅ ' + encontrados + ' pedidos nos detalhes tornados clicáveis!');
}

function organizarDetalhe(pedidoId, criterio) {
    var detailRow = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!detailRow) return;
    var tabela = detailRow.querySelector('table');
    if (!tabela) return;
    var tbody = tabela.querySelector('tbody');
    if (!tbody) return;
    var todasLinhas = tbody.querySelectorAll('tr');
    var linhaProdutos = null;
    todasLinhas.forEach(function(row) {
        if (row.id === 'body-condensado-' + pedidoId) linhaProdutos = row;
    });
    if (!linhaProdutos) return;
    var tabelaProdutos = linhaProdutos.querySelector('table');
    if (!tabelaProdutos) return;
    var tbodyProdutos = tabelaProdutos.querySelector('tbody');
    if (!tbodyProdutos) return;
    var linhasProdutos = tbodyProdutos.querySelectorAll('tr');
    if (linhasProdutos.length === 0) return;
    var colunaIndex = criterio === 'lucro' ? 8 : (criterio === 'lucroPercentual' ? 9 : 2);
    function extrairValor(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length <= colunaIndex) return 0;
        var texto = cells[colunaIndex].textContent.trim();
        texto = texto.replace(/R\$\s*/g, '');
        texto = texto.replace(/\./g, '').replace(',', '.');
        texto = texto.replace(/%/g, '');
        var valor = parseFloat(texto);
        return isNaN(valor) ? 0 : valor;
    }
    var linhasArray = Array.from(linhasProdutos);
    linhasArray.sort(function(a, b) { return extrairValor(b) - extrairValor(a); });
    tbodyProdutos.innerHTML = '';
    linhasArray.forEach(function(row) { tbodyProdutos.appendChild(row); });
    var todasLinhasAtualizadas = tbodyProdutos.querySelectorAll('tr');
    todasLinhasAtualizadas.forEach(function(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length > colunaIndex) {
            cells.forEach(function(cell, idx) {
                if (idx === colunaIndex) {
                    cell.style.fontWeight = 'bold';
                    cell.style.color = '#0b4f6c';
                    cell.style.background = '#e3f2fd';
                } else {
                    cell.style.fontWeight = '';
                    cell.style.color = '';
                    cell.style.background = '';
                }
            });
        }
    });
}

// ============================================================
// INTERCEPTAR TOGGLES DE DETALHES
// ============================================================

var toggles = ['toggleDetalhesProdutosMaisPedidos', 'toggleDetalhesProdutosMaiorLucro', 'toggleDetalhesProdutosMenosPedidos', 'toggleDetalhesProdutosMaiorDiferenca'];
toggles.forEach(function(nome) {
    if (typeof window[nome] === 'function') {
        var original = window[nome];
        window[nome] = function() {
            var resultado = original.apply(this, arguments);
            setTimeout(function() { tornarPedidosClicaveis(); }, 400);
            return resultado;
        };
    }
});

// ============================================================
// INTERCEPTAR toggleDetalhesProdutos E carregarProdutosDetalhados
// ============================================================

if (typeof window.toggleDetalhesProdutos === 'function') {
    var originalToggle = window.toggleDetalhesProdutos;
    window.toggleDetalhesProdutos = function(pedidoId) {
        var resultado = originalToggle.apply(this, arguments);
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 500);
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 1000);
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 2000);
        return resultado;
    };
}

if (typeof window.carregarProdutosDetalhados === 'function') {
    var originalCarregar = window.carregarProdutosDetalhados;
    window.carregarProdutosDetalhados = function(pedidoId) {
        var resultado = originalCarregar.apply(this, arguments);
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 600);
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 1200);
        return resultado;
    };
}

// ============================================================
// OBSERVAR MUDANÇAS NOS DETALHES
// ============================================================

var observerDetalhes = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
        if (mutation.type === 'childList') {
            var detailRows = document.querySelectorAll('.parcelas-detail.show');
            if (detailRows.length > 0) {
                var temBotoes = false;
                detailRows.forEach(function(row) {
                    if (row.querySelector('.btn-organizar-detalhe')) temBotoes = true;
                });
                if (!temBotoes) {
                    setTimeout(function() { adicionarBotoesATodosDetalhes(); }, 300);
                }
            }
        }
    });
});

var tableWrapper = document.getElementById('tableWrapper');
if (tableWrapper) {
    observerDetalhes.observe(tableWrapper, { childList: true, subtree: true });
}

// ============================================================
// FECHAR SUBMENU DE PRODUTOS AO CLICAR EM OUTROS BOTÕES
// ============================================================

var originalMostrarPedidosPorMes = window.mostrarPedidosPorMes;
var originalMostrarPagosPorMes = window.mostrarPagosPorMes;
var originalToggleSubmenuBoletos = window.toggleSubmenuBoletos;
var originalVoltarTabelaOriginal = window.voltarTabelaOriginal;

function fecharSubmenuProdutos() {
    var submenuProdutos = document.getElementById('submenuProdutos');
    var btnProdutos = document.getElementById('btnProdutos');
    if (submenuProdutos) submenuProdutos.style.display = 'none';
    if (btnProdutos) btnProdutos.classList.remove('active');
    document.querySelectorAll('#submenuProdutos .btn-submenu').forEach(function(b) { b.classList.remove('active'); });
    var tableWrapper = document.getElementById('tableWrapper');
    var dataTable = document.getElementById('dataTable');
    var statsContainer = document.getElementById('statsContainer');
    var mesContainer = document.getElementById('mesContainer');
    if (!dataTable && tableWrapper) {
        tableWrapper.innerHTML = '<table id="dataTable"><thead><tr><th>Pedido</th><th>Data</th><th>NF</th><th>Valor Total</th><th>Produtos</th><th>Royalties</th><th>Propaganda</th><th>Parcelas</th><th>Valor Pendente</th><th>Situação</th></tr></thead><tbody id="tableBody"></tbody></table>';
    }
    if (dataTable) dataTable.style.display = 'table';
    if (statsContainer) statsContainer.classList.remove('stats-hidden');
    if (mesContainer) mesContainer.style.display = 'none';
    document.querySelectorAll('.btn-actions .btn').forEach(function(b) {
        if (b.id !== 'btnProdutos') b.classList.remove('active');
    });
}

window.mostrarPagosPorMes = function() {
    fecharSubmenuProdutos();
    if (typeof originalMostrarPagosPorMes === 'function') return originalMostrarPagosPorMes.apply(this, arguments);
};
window.mostrarPedidosPorMes = function() {
    fecharSubmenuProdutos();
    if (typeof originalMostrarPedidosPorMes === 'function') return originalMostrarPedidosPorMes.apply(this, arguments);
};
window.toggleSubmenuBoletos = function() {
    fecharSubmenuProdutos();
    if (typeof originalToggleSubmenuBoletos === 'function') return originalToggleSubmenuBoletos.apply(this, arguments);
};
window.voltarTabelaOriginal = function() {
    fecharSubmenuProdutos();
    if (typeof originalVoltarTabelaOriginal === 'function') return originalVoltarTabelaOriginal.apply(this, arguments);
};

document.addEventListener('click', function(e) {
    var target = e.target.closest('.btn-actions .btn');
    if (!target) return;
    var id = target.id || '';
    var texto = target.textContent.trim();
    if (id === 'btnProdutos' || texto === 'Produtos') return;
    var submenuProdutos = document.getElementById('submenuProdutos');
    if (submenuProdutos && submenuProdutos.style.display === 'flex') fecharSubmenuProdutos();
}, true);

// ============================================================
// INICIALIZAR TUDO
// ============================================================

setTimeout(function() {
    inicializarSistemaNavegacao();
    aplicarStickyEmTodosDetalhes();
    setTimeout(adicionarBotoesATodosDetalhes, 800);
}, 500);

console.log('   - Busca de produtos');
console.log('   - Botões de organização nos detalhes');
console.log('   - Sticky em todos os detalhes');
