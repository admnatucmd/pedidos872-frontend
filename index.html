function tornarPedidosClicaveis() {
    console.log('🔄 Tornando pedidos clicáveis com produto do TÍTULO...');
    
    var detailCards = document.querySelectorAll('.detail-card');
    var encontrados = 0;
    
    detailCards.forEach(function(card) {
        var titulo = card.querySelector('strong');
        if (!titulo) return;
        
        var tituloTexto = titulo.textContent;
        
        var codigoProduto = '';
        var nomeProduto = '';
        
        var matchCodigo = tituloTexto.match(/produto\s*(\d+)/i);
        if (matchCodigo) {
            codigoProduto = matchCodigo[1];
        }
        
        var matchNome = tituloTexto.match(/-\s*(.+?)(?:\s*\(|$)/);
        if (matchNome) {
            nomeProduto = matchNome[1].trim();
        }
        
        if (!codigoProduto || !nomeProduto) return;
        
        var tabelas = card.querySelectorAll('table');
        tabelas.forEach(function(tabela) {
            var cabecalhos = tabela.querySelectorAll('thead th');
            var isTabelaPedidos = false;
            cabecalhos.forEach(function(th) {
                if (th.textContent.trim() === 'Pedido') {
                    isTabelaPedidos = true;
                }
            });
            
            if (!isTabelaPedidos) return;
            
            var rows = tabela.querySelectorAll('tbody tr');
            rows.forEach(function(row) {
                var cells = row.querySelectorAll('td');
                if (cells.length === 0) return;
                
                var celulaPedido = cells[0];
                var textoPedido = celulaPedido.textContent.trim();
                
                if (textoPedido.match(/^\d{8,9}$/)) {
                    var pedidoId = textoPedido;
                    
                    var linkAntigo = celulaPedido.querySelector('a');
                    if (linkAntigo) {
                        celulaPedido.innerHTML = pedidoId;
                    }
                    
                    var link = document.createElement('a');
                    link.href = '#';
                    link.textContent = pedidoId;
                    link.style.cssText = 'color:#0b4f6c;text-decoration:underline;cursor:pointer;font-weight:bold;';
                    link.title = 'Ir para o pedido ' + pedidoId;
                    
                    link.dataset.pedidoId = pedidoId;
                    link.dataset.codigoProduto = codigoProduto;
                    link.dataset.nomeProduto = nomeProduto;
                    
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log('🔗 CLICOU no pedido:', this.dataset.pedidoId);
                        console.log('🔗 Produto:', this.dataset.codigoProduto, '-', this.dataset.nomeProduto);
                        
                        if (typeof window.irParaPedido === 'function') {
                            window.irParaPedido(
                                this.dataset.pedidoId, 
                                this.dataset.codigoProduto, 
                                this.dataset.nomeProduto
                            );
                        }
                    });
                    
                    celulaPedido.innerHTML = '';
                    celulaPedido.appendChild(link);
                    encontrados++;
                }
            });
        });
    });
    
    console.log('✅ ' + encontrados + ' pedidos corrigidos com produto do TÍTULO!');
}

                <button class="btn-submenu" onclick="filtrarProdutosPorPedido('5meses')">Últimos 5 meses</button>
                <button class="btn-submenu" onclick="filtrarProdutosPorPedido('8meses')">Últimos 8 meses</button>
                <button class="btn-submenu" onclick="filtrarProdutosPorPedido('12meses')">Últimos 12 meses</button>
            </div>
        `;
    }
    
    if (tableWrapper) {
        tableWrapper.innerHTML = `
            <div style="text-align:center; padding:40px; color:#667;">
                <div class="loading" style="display:block;">⏳ Carregando dados de produtos...</div>
            </div>
        `;
    }
    
    if (!produtosData || produtosData.length === 0) {
        carregarProdutos().then(() => {
            window.produtosDataFiltrados = produtosData;
            renderizarTabelaProdutosComFiltro(produtosData);
            setTimeout(() => { aplicarTudoCompleto(); aplicarEstiloCompactoProdutos(); }, 500);
        }).catch(err => {
            if (tableWrapper) {
                tableWrapper.innerHTML = `
                    <div style="text-align:center; padding:40px; color:#dc3545;">
                        ❌ Erro ao carregar produtos: ${err.message}
                        <br><br>
                        <button onclick="mostrarProdutosPorPedido()" class="btn" style="background:#28a745;">Tentar novamente</button>
                    </div>
                `;
            }
        });
        return;
    }
    
    const periodo = window.periodoAtualProdutosPorPedido || 'todo';
    let dataLimite = null;
    const agora = new Date();
    
    if (periodo === 'mes') {
        dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    } else if (periodo === '3meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 3);
    } else if (periodo === '5meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 5);
    } else if (periodo === '8meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 8);
    } else if (periodo === '12meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 12);
    }
    
    let produtosFiltrados = produtosData;
    if (dataLimite) {
        produtosFiltrados = produtosData.filter(p => {
            const dataPedido = new Date(p.data.split('/').reverse().join('/'));
            return dataPedido >= dataLimite;
        });
    }
    
    window.produtosDataFiltrados = produtosFiltrados;
    
    if (produtosFiltrados && produtosFiltrados.length > 0) {
        renderizarTabelaProdutosComFiltro(produtosFiltrados);
        setTimeout(() => { aplicarTudoCompleto(); aplicarEstiloCompactoProdutos(); }, 500);
    } else if (tableWrapper) {
        tableWrapper.innerHTML = `
            <div style="text-align:center; padding:40px; color:#667;">
                📦 Nenhum dado de produto encontrado no período selecionado.
                <br><br>
                <button onclick="filtrarProdutosPorPedido('todo')" class="btn" style="background:#28a745;">Ver todos</button>
            </div>
        `;
    }
}

    if (mesContainer) mesContainer.style.display = 'none';
    window.periodoAtualDiferenca = 'todo';
    window.organizacaoAtualDiferenca = 'compra';
    const produtos = calcularProdutosMaiorDiferenca('todo');
    renderizarMaiorDiferenca(produtos, '📊 Maior diferença de preço - Todo o período');
    setTimeout(() => { aplicarTudoCompleto(); aplicarEstiloCompactoProdutos(); }, 500);
}

    const dadosParaRender = produtosFiltrados.slice().sort(function(a, b) {
        const dataA = new Date(a.data.split('/').reverse().join('/'));
        const dataB = new Date(b.data.split('/').reverse().join('/'));
        return dataB - dataA;
    });
    
    const colunaAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.coluna : null;

        { key: 'precoVenda', label: 'Preço de Venda', align: 'right' },

        var textColor = isAtiva ? 'color:#0b4f6c;' : 'color:#ffffff;';

    }
    html += '</tr></thead><tbody id="tableBody">';
    
    for (var i = 0; i < dadosParaRender.length; i++) {
        var p = dadosParaRender[i];
        var precoCompra = p.precoCompra || 0;
        var precoVenda = 0;
        if (p.linhas) {
            for (var l = 0; l < p.linhas.length; l++) {
                var item = p.linhas[l];
                if (item.isIndisponivel) continue;
                if (item.vendaTotal === 0) continue;
                var qtd = parseInt(item.quantidade) || 0;
                precoVenda += (item.vendaUnit || 0) * qtd;

.toLocaleString('pt-BR') + '</small></div></td></tr>';

function atualizarSetasCabecalho() {
    var colunaAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.coluna : null;
    var ordemAtiva = window.ordenacaoProdutosPorPedido ? window.ordenacaoProdutosPorPedido.ordem : 'asc';
    var headers = document.querySelectorAll('#tableWrapper thead th');
    headers.forEach(function(th) {
        var coluna = th.getAttribute('data-coluna');
        if (!coluna) return;
        var textoOriginal = th.getAttribute('data-texto-original');
        if (!textoOriginal) {
            textoOriginal = th.textContent.replace(/[▲▼▾▴]/g, '').trim();
            th.setAttribute('data-texto-original', textoOriginal);
        }
        var isAtiva = coluna === colunaAtiva;
        th.textContent = textoOriginal;
        var setaSpan = document.createElement('span');
        var seta = isAtiva ? (ordemAtiva === 'asc' ? ' ▲' : ' ▼') : ' ▾';
        setaSpan.textContent = seta;
        setaSpan.style.marginLeft = '2px';
        if (isAtiva) {
            setaSpan.style.color = '#0b4f6c';
            setaSpan.style.fontWeight = 'bold';
            th.style.background = '#e3f2fd';
            th.style.color = '#0b4f6c';
            th.style.fontWeight = 'bold';
        } else {
            setaSpan.style.color = 'rgba(255,255,255,0.6)';
            setaSpan.style.fontWeight = 'normal';
            th.style.background = '#1f5e7e';
            th.style.color = '#ffffff';
            th.style.fontWeight = 'normal';
        }
        th.appendChild(setaSpan);
        th.style.borderBottom = 'none';
        th.style.border = 'none';
    });
}

function ordenarProdutosPorPedido(coluna) {
    if (window.ordenacaoProdutosPorPedido.coluna === coluna) {
        window.ordenacaoProdutosPorPedido.ordem = window.ordenacaoProdutosPorPedido.ordem === 'asc' ? 'desc' : 'asc';
    } else {
        window.ordenacaoProdutosPorPedido.coluna = coluna;
        window.ordenacaoProdutosPorPedido.ordem = 'asc';
    }
    var ordem = window.ordenacaoProdutosPorPedido.ordem;
    var colunaIndex = { 'pedido': 0, 'data': 1, 'produtosUnicos': 2, 'quantidadeTotal': 3, 'pontos': 4, 'precoCompra': 5, 'precoVenda': 6, 'lucro': 7, 'lucroPercentual': 8, 'indisponiveis': 9 };
    var idx = colunaIndex[coluna];
    if (idx === undefined) return;
    var tbody = document.getElementById('tableBody');
    if (!tbody) return;
    var rows = Array.from(tbody.querySelectorAll('tr.pedido-row'));
    if (rows.length === 0) return;
    var rowsComDetalhes = rows.map(function(row) {
        var pedidoId = row.querySelector('td') ? row.querySelector('td').textContent.replace('▶', '').replace('▼', '').trim() : null;
        var detalheRow = pedidoId ? document.getElementById('detalhe-produtos-' + pedidoId) : null;
        return { row: row, detalheRow: detalheRow, pedidoId: pedidoId };
    });
    rowsComDetalhes.sort(function(a, b) {
        var cellsA = a.row.querySelectorAll('td');
        var cellsB = b.row.querySelectorAll('td');
        if (cellsA.length <= idx || cellsB.length <= idx) return 0;
        var valA = cellsA[idx].textContent.trim();
        var valB = cellsB[idx].textContent.trim();
        if (coluna === 'precoCompra' || coluna === 'precoVenda' || coluna === 'lucro' || coluna === 'lucroPercentual') {
            valA = parseFloat(valA.replace(/[R$\s.,]/g, '').replace(',', '.')) || 0;
            valB = parseFloat(valB.replace(/[R$\s.,]/g, '').replace(',', '.')) || 0;
        } else if (coluna === 'produtosUnicos' || coluna === 'quantidadeTotal' || coluna === 'pontos' || coluna === 'indisponiveis') {
            valA = parseInt(valA) || 0;
            valB = parseInt(valB) || 0;
        } else if (coluna === 'data') {
            var partesA = valA.split('/'), partesB = valB.split('/');
            if (partesA.length === 3 && partesB.length === 3) {
                valA = new Date(partesA[2], partesA[1] - 1, partesA[0]).getTime();
                valB = new Date(partesB[2], partesB[1] - 1, partesB[0]).getTime();
            }
        } else {
            valA = valA.toLowerCase();
            valB = valB.toLowerCase();
        }
        if (valA < valB) return ordem === 'asc' ? -1 : 1;
        if (valA > valB) return ordem === 'asc' ? 1 : -1;
        return 0;
    });
    rowsComDetalhes.forEach(function(item) {
        tbody.appendChild(item.row);
        if (item.detalheRow) tbody.appendChild(item.detalheRow);
    });
    atualizarSetasCabecalho();
    setTimeout(() => { aplicarTudoCompleto(); }, 100);
}

function filtrarProdutosPorPedido(periodo) {
    const botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
    botoes.forEach(b => b.classList.remove('active'));
    const periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
    botoes.forEach(b => {
        if (b.textContent.trim() === periodos[periodo]) b.classList.add('active');
    });
    window.periodoAtualProdutosPorPedido = periodo;
    mostrarProdutosPorPedido();
    setTimeout(() => { aplicarTudoCompleto(); aplicarEstiloCompactoProdutos(); }, 500);
}

async function carregarProdutosDetalhados(pedidoId) {
    const tbody = document.getElementById('produtos-detalhe-' + pedidoId);
    if (!tbody) return;
    if (tbody.querySelector('tr') && tbody.querySelector('tr').textContent !== 'Carregando produtos...') return;
    
    try {
        const response = await fetch(API_BASE_URL + '/api/sheet-data?sheet=Produtos', {
            method: 'GET',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result.success || !result.data) throw new Error('Erro ao buscar produtos');
        const data = result.data;
        
        const idxPedido = 0, idxCodigo = 10, idxProduto = 11, idxQuantidade = 12, idxPontos = 13;
        const idxValorUnit = 14, idxValorTotal = 15, idxVendaUnit = 16, idxVendaTotal = 17;
        const idxLucro = 18, idxLucroPercentual = 19, idxLucroReal = 20, idxLucroRealPercentual = 21, idxReferencia = 22;
        
        let linhasPedido = [], pedidoAtual = null;
        for (var i = 1; i < data.length; i++) {
            const row = data[i];
            if (row.length < 10) continue;
            let pedido = String(row[idxPedido] || '').trim();
            if (pedido === '' || pedido === 'Pedido') pedido = pedidoAtual;
            else pedidoAtual = pedido;
            if (pedido === pedidoId) {
                const codigo = String(row[idxCodigo] || '').trim();
                if (codigo !== '' && codigo !== 'CÓDIGO') linhasPedido.push(row);
            }
        }
        if (linhasPedido.length === 0) {
            tbody.innerHTML = '<tr><td colspan="13" style="text-align:center; padding:20px; color:#999;">Nenhum produto encontrado para este pedido.</td></tr>';
            return;
        }
        
        let disponiveis = [], indisponiveis = [];
        for (var l = 0; l < linhasPedido.length; l++) {
            const row = linhasPedido[l];
            const referencia = String(row[idxReferencia] || '').trim();
            if (referencia.indexOf('Produtos indisponível') !== -1) indisponiveis.push(row);
            else disponiveis.push(row);
        }
        
        const contagemProdutos = {};
        for (var d = 0; d < disponiveis.length; d++) {
            const row = disponiveis[d];
            const codigo = String(row[idxCodigo] || '').trim();
            const vendaUnit = limparValorProduto(String(row[idxVendaUnit] || '0'));
            const chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            contagemProdutos[chave] = (contagemProdutos[chave] || 0) + 1;
        }
        
        let produtosAgrupados = {}, produtosOriginal = [];
        for (var d = 0; d < disponiveis.length; d++) {
            const row = disponiveis[d];
            const codigo = String(row[idxCodigo] || '').trim();
            const vendaUnit = limparValorProduto(String(row[idxVendaUnit] || '0'));
            const chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            const temRepeticao = contagemProdutos[chave] > 1;
            if (!produtosAgrupados[chave]) {
                produtosAgrupados[chave] = {
                    codigo: codigo,
                    produto: String(row[idxProduto] || '').trim(),
                    vendaUnit: vendaUnit,
                    quantidadeTotal: 0,
                    valorCompraTotal: 0,
                    pontosTotal: 0,
                    lucroTotal: 0,
                    lucroPercentualTotal: 0,
                    referencia: String(row[idxReferencia] || '').trim(),
                    lucroReal: 0,
                    lucroRealPercentual: 0,
                    maiorValorUnit: 0,
                    referenciaMaiorValor: '',
                    lucroPercentualDescMaior: 0,
                    lucroRealDescMaior: 0,
                    itens: [],
                    temRepeticao: temRepeticao
                };
            }
            const qtd = parseInt(String(row[idxQuantidade] || '0').trim()) || 0;
            const valorUnit = limparValorProduto(String(row[idxValorUnit] || '0'));
            const pontos = parseInt(String(row[idxPontos] || '0').replace(/\./g, '').trim()) || 0;
            const lucro = limparValorProduto(String(row[idxLucro] || '0'));
            const lucroPercentual = limparValorProduto(String(row[idxLucroPercentual] || '0'));
            const lucroReal = limparValorProduto(String(row[idxLucroReal] || '0'));
            const lucroRealPercentual = limparValorProduto(String(row[idxLucroRealPercentual] || '0'));
            const referencia = String(row[idxReferencia] || '').trim();
            produtosAgrupados[chave].quantidadeTotal += qtd;
            produtosAgrupados[chave].valorCompraTotal += valorUnit * qtd;
            produtosAgrupados[chave].pontosTotal += pontos;
            produtosAgrupados[chave].lucroTotal += lucro;
            produtosAgrupados[chave].lucroPercentualTotal += lucroPercentual;
            produtosAgrupados[chave].itens.push({ qtd: qtd, valorUnit: valorUnit, pontos: pontos, lucro: lucro, lucroPercentual: lucroPercentual });
            if (valorUnit > produtosAgrupados[chave].maiorValorUnit) {
                produtosAgrupados[chave].maiorValorUnit = valorUnit;
                produtosAgrupados[chave].referenciaMaiorValor = referencia;
                produtosAgrupados[chave].lucroPercentualDescMaior = lucroRealPercentual;
                produtosAgrupados[chave].lucroRealDescMaior = lucroReal;
            }
            produtosOriginal.push({
                codigo: codigo,
                produto: String(row[idxProduto] || '').trim(),
                quantidade: qtd,
                pontos: pontos,
                valorUnit: valorUnit,
                valorTotal: limparValorProduto(String(row[idxValorTotal] || '0')),
                vendaUnit: vendaUnit,
                vendaTotal: limparValorProduto(String(row[idxVendaTotal] || '0')),
                lucro: lucro,
                lucroPercentual: lucroPercentual,
                lucroReal: lucroReal,
                lucroRealPercentual: lucroRealPercentual,
                referencia: referencia,
                temRepeticao: temRepeticao
            });
        }
        
        let html = '';
        const bodyCondensado = 'body-condensado-' + pedidoId;
        const bodyOriginal = 'body-original-' + pedidoId;
        
        html += '<tr><td colspan="13" style="padding:8px 8px; text-align:center; background:#f0f4f8; border-bottom:2px solid #e0e0e0;"><button onclick="toggleVisualizacaoProdutos(\'' + pedidoId + '\')" style="background:#ffcc80; color:#333; border:none; padding:6px 18px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;"><span id="toggle-text-' + pedidoId + '">Mostrar igual do site natura</span></button></td></tr>';
        
        html += '<tr id="' + bodyCondensado + '"><td colspan="13"><div style="width:100%;"><table style="width:100%; border-collapse:collapse; font-size:12px;"><thead><tr style="background:#f1f3f5;"><th style="padding:6px 8px; text-align:left; border-bottom:1px solid #ddd;">Código</th><th style="padding:6px 8px; text-align:left; border-bottom:1px solid #ddd;">Produto</th><th style="padding:6px 8px; text-align:center; border-bottom:1px solid #ddd;">Qtd</th><th style="padding:6px 8px; text-align:center; border-bottom:1px solid #ddd;">Pontos</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Valor Unit</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Valor Total</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Venda Unit</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Venda Total</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Lucro</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Lucro %</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Lucro c/ Desc</th><th style="padding:6px 8px; text-align:right; border-bottom:1px solid #ddd;">Lucro % c/ Desc</th><th style="padding:6px 8px; text-align:left; border-bottom:1px solid #ddd;">Referência</th></tr></thead><tbody>';
        for (var chave in produtosAgrupados) {
            var item = produtosAgrupados[chave];
            var valorCompraMedio = item.quantidadeTotal > 0 ? item.valorCompraTotal / item.quantidadeTotal : 0;
            var valorVendaTotal = item.vendaUnit * item.quantidadeTotal;
            var lucroReal = item.vendaUnit - valorCompraMedio;
            var lucroPercentual = valorCompraMedio > 0 ? (lucroReal / valorCompraMedio) * 100 : 0;
            var bgColor = item.temRepeticao ? 'background:#e8f5e9;' : '';
            html += '<tr style="' + bgColor + '"><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle;">' + item.codigo + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle;">' + item.produto + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:center;">' + item.quantidadeTotal + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:center;">' + item.pontosTotal + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(valorCompraMedio) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(item.valorCompraTotal) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(item.vendaUnit) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(valorVendaTotal) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(lucroReal) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + lucroPercentual.toFixed(1) + '%</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + formatarMoedaBR(item.lucroRealDescMaior) + '</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:right;">' + item.lucroPercentualDescMaior.toFixed(1) + '%</td><td style="padding:6px 8px; border-bottom:1px solid #e9ecef; vertical-align:middle; text-align:left; font-size:11px; color:#667;">' + item.referenciaMaiorValor + '</td></tr>';

function calcularProdutosMaisPedidos(periodo) {
    let dataLimite = null;
    const agora = new Date();
    if (periodo === 'mes') dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    else if (periodo === '3meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 3); }
    else if (periodo === '5meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 5); }
    else if (periodo === '8meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 8); }
    else if (periodo === '12meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 12); }
    
    const produtos = {};
    let totalPedidos = 0;
    for (let p = 0; p < produtosData.length; p++) {
        const pedido = produtosData[p];
        if (dataLimite) {
            const dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        totalPedidos++;
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        const produtosDoPedido = {};
        for (let l = 0; l < pedido.linhas.length; l++) {
            const linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            const codigo = linha.codigo;
            if (!codigo) continue;
            const vendaUnit = linha.vendaUnit || 0;
            const chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            if (!produtosDoPedido[chave]) {
                produtosDoPedido[chave] = { codigo: codigo, produto: linha.produto, vendaUnit: vendaUnit, quantidadeTotal: 0, valorCompraTotal: 0, items: [] };
            }
            const qtd = parseInt(linha.quantidade) || 0;
            const valorUnit = linha.valorUnit || 0;
            produtosDoPedido[chave].quantidadeTotal += qtd;
            produtosDoPedido[chave].valorCompraTotal += valorUnit * qtd;
            produtosDoPedido[chave].items.push({ quantidade: qtd, valorUnit: valorUnit });
        }
        for (const chave in produtosDoPedido) {
            const item = produtosDoPedido[chave];
            const codigo = item.codigo;
            const valorCompraMedio = item.quantidadeTotal > 0 ? item.valorCompraTotal / item.quantidadeTotal : 0;
            const lucroUni = item.vendaUnit - valorCompraMedio;
            const lucroPercentual = valorCompraMedio > 0 ? (lucroUni / valorCompraMedio) * 100 : 0;
            if (!produtos[codigo]) {
                produtos[codigo] = { codigo: codigo, produto: item.produto, vezes: 0, quantidadeTotal: 0, valoresCompra: [], valoresVenda: [], lucros: [], lucrosPercentuais: [], pedidos: [] };
            }
            produtos[codigo].vezes++;
            produtos[codigo].quantidadeTotal += item.quantidadeTotal;
            if (valorCompraMedio > 0) produtos[codigo].valoresCompra.push(valorCompraMedio);
            if (item.vendaUnit > 0) produtos[codigo].valoresVenda.push(item.vendaUnit);
            if (lucroUni > 0) produtos[codigo].lucros.push(lucroUni);
            if (lucroPercentual > 0) produtos[codigo].lucrosPercentuais.push(lucroPercentual);
            produtos[codigo].pedidos.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidade: item.quantidadeTotal,
                valorCompra: valorCompraMedio,
                valorVenda: item.vendaUnit,
                lucroUni: lucroUni,
                lucroPercentual: lucroPercentual
            });
        }
    }
    const resultados = Object.values(produtos);
    resultados.sort(function(a, b) { return b.quantidadeTotal - a.quantidadeTotal; });
    return resultados;
}

                produtosDoPedido[chave] = { codigo: codigo, produto: linha.produto, vendaUnit: vendaUnit, quantidadeTotal: 0, valorCompraTotal: 0, items: [] };
            }
            const qtd = parseInt(linha.quantidade) || 0;
            const valorUnit = linha.valorUnit || 0;
            produtosDoPedido[chave].quantidadeTotal += qtd;
            produtosDoPedido[chave].valorCompraTotal += valorUnit * qtd;
            produtosDoPedido[chave].items.push({ quantidade: qtd, valorUnit: valorUnit });
        }
        for (const chave in produtosDoPedido) {
            const item = produtosDoPedido[chave];
            const codigo = item.codigo;
            const valorCompraMedio = item.quantidadeTotal > 0 ? item.valorCompraTotal / item.quantidadeTotal : 0;
            const lucroUni = item.vendaUnit - valorCompraMedio;
            const lucroPercentual = valorCompraMedio > 0 ? (lucroUni / valorCompraMedio) * 100 : 0;
            if (!produtos[codigo]) {
                produtos[codigo] = { codigo: codigo, produto: item.produto, vezes: 0, quantidadeTotal: 0, valoresCompra: [], valoresVenda: [], lucros: [], lucrosPercentuais: [], pedidos: [] };
            }
            produtos[codigo].vezes++;
            produtos[codigo].quantidadeTotal += item.quantidadeTotal;
            if (valorCompraMedio > 0) produtos[codigo].valoresCompra.push(valorCompraMedio);
            if (item.vendaUnit > 0) produtos[codigo].valoresVenda.push(item.vendaUnit);
            if (lucroUni > 0) produtos[codigo].lucros.push(lucroUni);
            if (lucroPercentual > 0) produtos[codigo].lucrosPercentuais.push(lucroPercentual);
            produtos[codigo].pedidos.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidade: item.quantidadeTotal,
                valorCompra: valorCompraMedio,
                valorVenda: item.vendaUnit,
                lucroUni: lucroUni,
                lucroPercentual: lucroPercentual
            });
        }
    }
    const resultados = Object.values(produtos);
    const organizacao = window.organizacaoAtualDiferenca || 'compra';
    resultados.sort(function(a, b) {
        let valorA, valorB;
        if (organizacao === 'compra') {
            const minA = a.valoresCompra.length > 0 ? Math.min.apply(null, a.valoresCompra) : 0;
            const maxA = a.valoresCompra.length > 0 ? Math.max.apply(null, a.valoresCompra) : 0;
            const minB = b.valoresCompra.length > 0 ? Math.min.apply(null, b.valoresCompra) : 0;
            const maxB = b.valoresCompra.length > 0 ? Math.max.apply(null, b.valoresCompra) : 0;
            valorA = maxA - minA;
            valorB = maxB - minB;
        } else if (organizacao === 'venda') {
            const minA = a.valoresVenda.length > 0 ? Math.min.apply(null, a.valoresVenda) : 0;
            const maxA = a.valoresVenda.length > 0 ? Math.max.apply(null, a.valoresVenda) : 0;
            const minB = b.valoresVenda.length > 0 ? Math.min.apply(null, b.valoresVenda) : 0;
            const maxB = b.valoresVenda.length > 0 ? Math.max.apply(null, b.valoresVenda) : 0;
            valorA = maxA - minA;
            valorB = maxB - minB;
        } else if (organizacao === 'lucro') {
            const minA = a.lucros.length > 0 ? Math.min.apply(null, a.lucros) : 0;
            const maxA = a.lucros.length > 0 ? Math.max.apply(null, a.lucros) : 0;
            const minB = b.lucros.length > 0 ? Math.min.apply(null, b.lucros) : 0;
            const maxB = b.lucros.length > 0 ? Math.max.apply(null, b.lucros) : 0;
            valorA = maxA - minA;
            valorB = maxB - minB;
        } else {
            const minA = a.lucrosPercentuais.length > 0 ? Math.min.apply(null, a.lucrosPercentuais) : 0;
            const maxA = a.lucrosPercentuais.length > 0 ? Math.max.apply(null, a.lucrosPercentuais) : 0;
            const minB = b.lucrosPercentuais.length > 0 ? Math.min.apply(null, b.lucrosPercentuais) : 0;
            const maxB = b.lucrosPercentuais.length > 0 ? Math.max.apply(null, b.lucrosPercentuais) : 0;
            valorA = maxA - minA;
            valorB = maxB - minB;
        }
        return valorB - valorA;
    });
    return resultados;
}

function toggleDetalhesProdutosMaisPedidos(codigo) {
    const row = document.getElementById('detalhe-produto-mais-pedido-' + codigo);
    if (!row) return;
    row.classList.toggle('show');
    const icon = row.previousElementSibling.querySelector('.expand-icon');
    if (icon) icon.innerHTML = row.classList.contains('show') ? '▼' : '▶';
    if (row.classList.contains('show')) {
        const container = document.getElementById('detalhe-pedidos-produto-' + codigo);
        if (!container) return;
        if (container.innerHTML.indexOf('Clique para carregar') === -1 && container.innerHTML.trim() !== '') return;
        const pedidosAgrupados = {};
        for (let p = 0; p < produtosData.length; p++) {
            const pedido = produtosData[p];
            if (!pedido.linhas) continue;
            const pedidoKey = pedido.pedido;
            if (!pedidosAgrupados[pedidoKey]) {
                pedidosAgrupados[pedidoKey] = { pedido: pedido.pedido, data: pedido.data, quantidadeTotal: 0, valorCompraTotal: 0, valorVenda: 0 };
            }
            for (let l = 0; l < pedido.linhas.length; l++) {
                const linha = pedido.linhas[l];
                if (linha.codigo === codigo && !linha.isIndisponivel) {
                    const qtd = parseInt(linha.quantidade) || 0;
                    const valorUnit = linha.valorUnit || 0;
                    const vendaUnit = linha.vendaUnit || 0;
                    pedidosAgrupados[pedidoKey].quantidadeTotal += qtd;
                    pedidosAgrupados[pedidoKey].valorCompraTotal += valorUnit * qtd;
                    pedidosAgrupados[pedidoKey].valorVenda = vendaUnit;
                }
            }
        }
        let html = '<table style="width:100%; border-collapse:collapse; font-size:12px;"><thead><tr style="background:#f1f3f5;"><th style="padding:6px 8px; text-align:left;">Pedido</th><th style="padding:6px 8px; text-align:left;">Data</th><th style="padding:6px 8px; text-align:center;">Qtd</th><th style="padding:6px 8px; text-align:right;">Valor Compra Uni</th><th style="padding:6px 8px; text-align:right;">Valor Venda Uni</th><th style="padding:6px 8px; text-align:right;">Valor Compra Total</th><th style="padding:6px 8px; text-align:right;">Valor Venda Total</th><th style="padding:6px 8px; text-align:right;">Lucro Uni</th><th style="padding:6px 8px; text-align:right;">Lucro Total</th><th style="padding:6px 8px; text-align:right;">Lucro %</th></tr></thead><tbody>';
        let temPedidos = false;
        for (const pedidoKey in pedidosAgrupados) {
            const item = pedidosAgrupados[pedidoKey];
            if (item.quantidadeTotal === 0) continue;
            temPedidos = true;
            const valorCompraMedio = item.valorCompraTotal / item.quantidadeTotal;
            const valorCompraTotal = item.valorCompraTotal;
            const valorVendaTotal = item.valorVenda * item.quantidadeTotal;
            const lucroUni = item.valorVenda - valorCompraMedio;
            const lucroTotal = lucroUni * item.quantidadeTotal;
            const lucroPercentual = item.valorCompraTotal > 0 ? (lucroTotal / item.valorCompraTotal) * 100 : 0;
            html += '<tr><td style="padding:6px 8px;">' + item.pedido + '</td><td style="padding:6px 8px;">' + item.data + '</td><td style="padding:6px 8px; text-align:center;">' + item.quantidadeTotal + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(valorCompraMedio) + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(item.valorVenda) + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(valorCompraTotal) + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(valorVendaTotal) + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(lucroUni) + '</td><td style="padding:6px 8px; text-align:right;">' + formatarMoedaBR(lucroTotal) + '</td><td style="padding:6px 8px; text-align:right;">' + lucroPercentual.toFixed(1) + '%</td></tr>';
        }
        html += '</tbody></table>';
        if (!temPedidos) html = '<div style="text-align:center; padding:20px; color:#999;">Nenhum pedido encontrado para este produto.</div>';
        container.innerHTML = html;
        setTimeout(() => { aplicarStickyDetalhesMaisPedidos(); }, 100);
    }
}

function irParaProdutosDoPedido(pedidoId) {
    console.log('🔍 Abrindo produtos do pedido:', pedidoId);
    
    var submenuProdutos = document.getElementById('submenuProdutos');
    var btnProdutos = document.getElementById('btnProdutos');
    
    if (!submenuProdutos || !btnProdutos) {
        console.error('❌ Elementos de produtos não encontrados');
        return;
    }
    
    var submenuBoletos = document.getElementById('submenuBoletos');
    var btnBoletosPagar = document.getElementById('btnBoletosPagar');
    if (submenuBoletos) submenuBoletos.style.display = 'none';
    if (btnBoletosPagar) btnBoletosPagar.classList.remove('active');
    
    document.querySelectorAll('.btn-actions .btn').forEach(b => b.classList.remove('active'));
    btnProdutos.classList.add('active');
    submenuProdutos.style.display = 'flex';
    
    var dataTable = document.getElementById('dataTable');
    var mesContainer = document.getElementById('mesContainer');
    var semanaInfo = document.getElementById('semanaInfo');
    var statsContainer = document.getElementById('statsContainer');
    var tableWrapper = document.getElementById('tableWrapper');
    
    if (dataTable) dataTable.style.display = 'none';
    if (mesContainer) mesContainer.style.display = 'none';
    if (semanaInfo) semanaInfo.style.display = 'none';
    if (statsContainer) statsContainer.classList.add('stats-hidden');
    if (tableWrapper) tableWrapper.innerHTML = '';
    
    if (typeof window.mostrarProdutosPorPedido === 'function') {
        window.mostrarProdutosPorPedido();
        
        var tentativas = 0;
        var maxTentativas = 30;
        
        var intervalo = setInterval(function() {
            tentativas++;
            var rows = document.querySelectorAll('#tableBody tr.pedido-row');
            var encontrado = false;
            
            for (var row of rows) {
                var cell = row.querySelector('td:first-child');
                if (cell) {
                    var texto = cell.textContent.replace('▶', '').replace('▼', '').trim();
                    if (texto === String(pedidoId)) {
                        encontrado = true;
                        console.log('✅ Pedido encontrado nos produtos!');
                        
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        row.style.transition = 'background 0.3s';
                        row.style.background = '#e3f2fd';
                        
                        var detailId = 'detalhe-produtos-' + pedidoId;
                        var detailRow = document.getElementById(detailId);
                        if (detailRow) {
                            detailRow.classList.add('show');
                            var icon = row.querySelector('.expand-icon');
                            if (icon) icon.innerHTML = '▼';
                            
                            if (typeof window.carregarProdutosDetalhados === 'function') {
                                window.carregarProdutosDetalhados(pedidoId);
                            }
                        }
                        
                        setTimeout(function() {
                            row.style.background = '';
                        }, 5000);
                        
                        clearInterval(intervalo);
                        return;
                    }
                }
            }
            
            if (!encontrado && tentativas >= maxTentativas) {
                console.log('⚠️ Pedido não encontrado nos produtos');
                clearInterval(intervalo);
            }
        }, 300);
    } else {
        console.error('❌ mostrarProdutosPorPedido não encontrada');
    }
}


function irParaPedido(pedidoId, codigoProduto, nomeProduto) {
    console.log('🔍 irParaPedido chamado para:', pedidoId);
    console.log('   📌 Código produto:', codigoProduto);
    console.log('   📌 Nome produto:', nomeProduto);
    
    var submenuProdutos = document.getElementById('submenuProdutos');
    var estaNaAreaProdutos = submenuProdutos && submenuProdutos.style.display === 'flex';
    var veioDeProdutos = codigoProduto !== undefined || estaNaAreaProdutos;
    var buscaProdutosAtiva = window.modoBuscaAtivo || false;
    
    console.log('   📊 Está na área de produtos?', estaNaAreaProdutos);
    console.log('   📊 Veio de produtos?', veioDeProdutos);
    
    if (veioDeProdutos || estaNaAreaProdutos || buscaProdutosAtiva) {
        console.log('🎯 Abrindo em "Produtos por pedido" com destaque amarelo...');
        
        function destacarProduto(tentativa) {
            tentativa = tentativa || 1;
            console.log('🟡 Tentativa ' + tentativa + ' - buscando:', codigoProduto);
            
            var detailId = 'detalhe-produtos-' + pedidoId;
            var detailRow = document.getElementById(detailId);
            
            if (!detailRow || !detailRow.classList.contains('show')) {
                console.log('⏳ Aguardando detalhes...');
                if (tentativa < 15) {
                    setTimeout(function() { destacarProduto(tentativa + 1); }, 500);
                }
                return;
            }
            
            var tabelaDetalhes = detailRow.querySelector('table');
            if (!tabelaDetalhes) {
                console.log('⏳ Aguardando tabela...');
                if (tentativa < 15) {
                    setTimeout(function() { destacarProduto(tentativa + 1); }, 500);
                }
                return;
            }
            
            var linhasProdutos = tabelaDetalhes.querySelectorAll('tbody tr');
            
            if (linhasProdutos.length === 0 || linhasProdutos[0].textContent.includes('Carregando')) {
                console.log('⏳ Aguardando produtos...');
                if (tentativa < 15) {
                    setTimeout(function() { destacarProduto(tentativa + 1); }, 500);
                }
                return;
            }
            
            var encontrou = false;
            linhasProdutos.forEach(function(linha) {
                var cells = linha.querySelectorAll('td');
                if (cells.length < 2) return;
                var codigo = cells[0].textContent.trim();
                var nome = cells[1].textContent.trim();
                if (codigo === String(codigoProduto) || nome.includes(nomeProduto)) {
                    console.log('✅ PRODUTO ENCONTRADO!');
                    linha.style.transition = 'background 0.3s';
                    linha.style.background = '#fff3cd';
                    linha.style.borderLeft = '4px solid #ffc107';
                    linha.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    encontrou = true;
                }
            });
            
            if (!encontrou) {
                console.log('⏳ Produto não encontrado, tentando novamente...');
                if (tentativa < 15) {
                    setTimeout(function() { destacarProduto(tentativa + 1); }, 800);
                } else {
                    console.log('❌ Produto não encontrado após 15 tentativas');
                }
            }
        }
        
        if (typeof window.irParaProdutosDoPedido === 'function') {
            window.irParaProdutosDoPedido(pedidoId);
            setTimeout(function() { destacarProduto(1); }, 1500);
            setTimeout(function() { destacarProduto(1); }, 3000);
        } else {
            if (typeof window.irParaPedidoOriginal === 'function') {
                window.irParaPedidoOriginal(pedidoId, codigoProduto, nomeProduto);
            }
        }
        return;
    }
    
    console.log('🎯 Voltando para a tabela de pedidos...');
    
    if (typeof window.voltarTabelaOriginal === 'function') {
        window.voltarTabelaOriginal();
    }
    
    setTimeout(function() {
        console.log('🔍 Procurando pedido na tabela de pedidos:', pedidoId);
        
        var rows = document.querySelectorAll('.pedido-row');
        var encontrado = false;
        
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var cell = row.querySelector('td:first-child');
            if (cell) {
                var texto = cell.textContent.replace('▶', '').replace('▼', '').trim();
                if (texto === String(pedidoId)) {
                    encontrado = true;
                    console.log('✅ Pedido encontrado!');
                    
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.style.transition = 'background 0.3s';
                    row.style.background = '#e3f2fd';
                    
                    var detailId = 'detalhe-' + pedidoId;
                    var detailRow = document.getElementById(detailId);
                    if (detailRow) {
                        detailRow.classList.add('show');
                        var icon = row.querySelector('.expand-icon');
                        if (icon) icon.innerHTML = '▼';
                    }
                    
                    setTimeout(function() {
                        row.style.background = '';
                    }, 5000);
                    break;
                }
            }
        }
        
        if (!encontrado) {
            console.log('⚠️ Pedido não encontrado na tabela');
        }
    }, 500);
}

function organizarDetalhe(pedidoId, criterio) {
    console.log('🔄 Organizando pedido ' + pedidoId + ' por: ' + criterio);
    const detailRow = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!detailRow) return;
    const tabela = detailRow.querySelector('table');
    if (!tabela) return;
    const tbody = tabela.querySelector('tbody');
    if (!tbody) return;
    const todasLinhas = tbody.querySelectorAll('tr');
    let linhaProdutos = null;
    todasLinhas.forEach(function(row) {
        if (row.id === 'body-condensado-' + pedidoId) linhaProdutos = row;
    });
    if (!linhaProdutos) return;
    const tabelaProdutos = linhaProdutos.querySelector('table');
    if (!tabelaProdutos) return;
    const tbodyProdutos = tabelaProdutos.querySelector('tbody');
    if (!tbodyProdutos) return;
    const linhasProdutos = tbodyProdutos.querySelectorAll('tr');
    if (linhasProdutos.length === 0) return;
    const colunaIndex = criterio === 'lucro' ? 8 : (criterio === 'lucroPercentual' ? 9 : 2);
    function extrairValor(row) {
        const cells = row.querySelectorAll('td');
        if (cells.length <= colunaIndex) return 0;
        let texto = cells[colunaIndex].textContent.trim();
        texto = texto.replace(/R\$\s*/g, '');
        texto = texto.replace(/\./g, '').replace(',', '.');
        texto = texto.replace(/%/g, '');
        return parseFloat(texto) || 0;
    }
    const linhasArray = Array.from(linhasProdutos);
    linhasArray.sort(function(a, b) { return extrairValor(b) - extrairValor(a); });
    tbodyProdutos.innerHTML = '';
    linhasArray.forEach(function(row) { tbodyProdutos.appendChild(row); });
    const todasLinhasAtualizadas = tbodyProdutos.querySelectorAll('tr');
    todasLinhasAtualizadas.forEach(function(row) {
        const cells = row.querySelectorAll('td');
        if (cells.length > colunaIndex) {
            cells.forEach(function(cell, idx) {
                if (idx === colunaIndex) {
                    cell.style.fontWeight = 'bold';
                    cell.style.color = '#0b4f6c';
                    cell.style.background = '#e3f2fd';
                } else {
                    cell.style.fontWeight = '';
                    cell.style.color = '';
                    cell.style.background = '';
                }
            });
        }
    });
}

function ordenarBoletosPorData(boletos) {
    return boletos.sort(function(a, b) {
        return dataParaComparacao(a.parcela.vencimento) - dataParaComparacao(b.parcela.vencimento);
    });
}

function reordenarBoletosNaTela() {
    const container = document.getElementById('mesContainer');
    if (!container) return;
    const boletoCards = container.querySelectorAll('.boleto-card');
    if (boletoCards.length === 0) return;
    const cardsComData = [];
    boletoCards.forEach(function(card) {
        let vencimentoSpan = card.querySelector('.boleto-vencimento');
        let dataVenc = null;
        if (vencimentoSpan) {
            const texto = vencimentoSpan.textContent || '';
            const match = texto.match(/(\d{2}\/\d{2}\/\d{4})/);
            if (match) dataVenc = match[1];
        }
        if (!dataVenc) {
            const allText = card.textContent || '';
            const match = allText.match(/(\d{2}\/\d{2}\/\d{4})/);
            if (match) dataVenc = match[1];
        }
        if (dataVenc) {
            cardsComData.push({
                card: card,
                data: dataVenc,
                dataObj: dataParaComparacao(dataVenc)
            });
        } else {
            cardsComData.push({
                card: card,
                data: null,
                dataObj: new Date(2099, 11, 31)
            });
        }
    });
    cardsComData.sort(function(a, b) { return a.dataObj - b.dataObj; });
    const parent = cardsComData[0]?.card?.parentNode;
    if (parent) {
        cardsComData.forEach(function(item) { parent.appendChild(item.card); });
    }
}

// ===== 1. CONFIGURAR BOTÃO "X" DENTRO DO CAMPO =====
function configurarBotaoX() {
    const input = document.getElementById('inputBuscaProduto');

    const container = document.getElementById('containerBuscaProduto');
    if (!container) return;
    
    let wrapper = container.querySelector('.input-wrapper');
    if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.className = 'input-wrapper';
        wrapper.style.cssText = 'position:relative;flex:1;min-width:180px;max-width:400px;display:inline-block;';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);
        input.style.cssText = 'width:100%;padding:6px 32px 6px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;box-sizing:border-box;';
    }
    
    let btnClear = wrapper.querySelector('.btn-clear-input');
    if (!btnClear) {
        btnClear = document.createElement('button');
        btnClear.className = 'btn-clear-input';
        btnClear.textContent = '✕';
        btnClear.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:#999;padding:4px 6px;border-radius:4px;display:none;z-index:1;';
        btnClear.addEventListener('click', function(e) {
            e.stopPropagation();
            input.value = '';
            input.focus();
            this.style.display = 'none';
            const event = new Event('input', { bubbles: true });
            input.dispatchEvent(event);
        });
        wrapper.appendChild(btnClear);
    }
    
    function toggleClearButton() {
        btnClear.style.display = input.value.length > 0 ? 'block' : 'none';
    }
    input.removeEventListener('input', toggleClearButton);
    input.removeEventListener('focus', toggleClearButton);
    input.addEventListener('input', toggleClearButton);
    input.addEventListener('focus', toggleClearButton);
    input.addEventListener('blur', function() {
        setTimeout(toggleClearButton, 200);
    });
    toggleClearButton();
}

// ===== 5. EXECUTAR BUSCA =====
function executarBuscaProduto() {
    const input = document.getElementById('inputBuscaProduto');
    if (!input) return;

    if (termo === '') {
        mostrarBuscaProdutos();
        return;
    }
    window.termoBusca = termo;
    const periodo = window.periodoBusca || 'todo';
    const produtosEncontrados = buscarProdutosPorTermo(termo, periodo);
    renderizarResultadosBusca(produtosEncontrados, termo, periodo);
}

// ===== 6. BUSCAR PRODUTOS POR TERMO =====
function buscarProdutosPorTermo(termo, periodo) {
    let dataLimite = null;
    const agora = new Date();
    if (periodo === 'mes') dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    else if (periodo === '3meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 3); }
    else if (periodo === '5meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 5); }
    else if (periodo === '8meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 8); }
    else if (periodo === '12meses') { dataLimite = new Date(agora); dataLimite.setMonth(agora.getMonth() - 12); }
    
    const produtosMap = {};
    const termoLower = termo.toLowerCase();
    
    if (typeof produtosData === 'undefined' || produtosData.length === 0) return [];
    
    for (let p = 0; p < produtosData.length; p++) {
        const pedido = produtosData[p];
        if (dataLimite) {
            const dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        
        for (let l = 0; l < pedido.linhas.length; l++) {
            const linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            const codigo = (linha.codigo || '').toLowerCase();
            const produto = (linha.produto || '').toLowerCase();
            
            if (codigo.indexOf(termoLower) !== -1 || produto.indexOf(termoLower) !== -1) {
                const chave = linha.codigo;
                if (!produtosMap[chave]) {
                    const qtd = parseInt(linha.quantidade) || 0;
                    const valorUnit = linha.valorUnit || 0;
                    const vendaUnit = linha.vendaUnit || 0;
                    const lucroUni = vendaUnit - valorUnit;
                    const lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    produtosMap[chave] = {
                        codigo: linha.codigo || '',
                        produto: linha.produto || '',
                        vezes: 1,
                        quantidadeTotal: qtd,
                        valoresCompra: [valorUnit],
                        valoresVenda: [vendaUnit],
                        lucros: [lucroUni],
                        lucrosPercentuais: [lucroPercentual],
                        pedidos: [{ pedido: pedido.pedido, data: pedido.data, quantidade: qtd, valorCompra: valorUnit, valorVenda: vendaUnit, lucroUni: lucroUni, lucroPercentual: lucroPercentual }]
                    };
                } else {
                    const item = produtosMap[chave];
                    const qtd = parseInt(linha.quantidade) || 0;
                    const valorUnit = linha.valorUnit || 0;
                    const vendaUnit = linha.vendaUnit || 0;
                    const lucroUni = vendaUnit - valorUnit;
                    const lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    item.vezes++;
                    item.quantidadeTotal += qtd;
                    item.valoresCompra.push(valorUnit);
                    item.valoresVenda.push(vendaUnit);
                    item.lucros.push(lucroUni);
                    item.lucrosPercentuais.push(lucroPercentual);
                    item.pedidos.push({ pedido: pedido.pedido, data: pedido.data, quantidade: qtd, valorCompra: valorUnit, valorVenda: vendaUnit, lucroUni: lucroUni, lucroPercentual: lucroPercentual });
                }
            }
        }
    }
    
    const resultados = Object.values(produtosMap);
    resultados.sort(function(a, b) { return b.quantidadeTotal - a.quantidadeTotal; });
    return resultados;
}

/**
 * ABRE A ABA DE PRODUTOS E DESTACA O PEDIDO ESPECÍFICO
 * @param {string} pedidoId - ID do pedido para abrir
 */
function irParaProdutosDoPedido(pedidoId) {
    console.log('🔍 irParaProdutosDoPedido chamado para:', pedidoId);
    
    // ===== 1. Verificar elementos =====
    const submenuProdutos = document.getElementById('submenuProdutos');
    const btnProdutos = document.getElementById('btnProdutos');
    
    if (!submenuProdutos || !btnProdutos) {
        console.error('❌ Elementos de produtos não encontrados');
        return;
    }
    
    // ===== 2. Fechar outros submenus =====
    const submenuBoletos = document.getElementById('submenuBoletos');
    const btnBoletosPagar = document.getElementById('btnBoletosPagar');
    if (submenuBoletos) {
        submenuBoletos.style.display = 'none';
    }
    if (btnBoletosPagar) {
        btnBoletosPagar.classList.remove('active');
    }
    
    // ===== 3. Ativar submenu de produtos =====
    document.querySelectorAll('.btn-actions .btn').forEach(function(b) {
        b.classList.remove('active');
    });
    btnProdutos.classList.add('active');
    submenuProdutos.style.display = 'flex';
    
    // ===== 4. Esconder outros elementos =====
    const dataTable = document.getElementById('dataTable');
    const mesContainer = document.getElementById('mesContainer');
    const semanaInfo = document.getElementById('semanaInfo');
    const statsContainer = document.getElementById('statsContainer');
    const tableWrapper = document.getElementById('tableWrapper');
    
    if (dataTable) {
        dataTable.style.display = 'none';
    }
    if (mesContainer) {
        mesContainer.style.display = 'none';
    }
    if (semanaInfo) {
        semanaInfo.style.display = 'none';
    }
    if (statsContainer) {
        statsContainer.classList.add('stats-hidden');
    }
    if (tableWrapper) {
        tableWrapper.innerHTML = '';
    }
    
    // ===== 5. Mostrar a tabela de produtos =====
    if (typeof window.mostrarProdutosPorPedido !== 'function') {
        console.error('❌ mostrarProdutosPorPedido não encontrada');
        return;
    }
    
    window.mostrarProdutosPorPedido();
    
    // ===== 6. Aguardar carregar e destacar o pedido =====
    let tentativas = 0;
    const maxTentativas = 40;
    
    var intervalo = setInterval(function() {
        tentativas++;
        
        // Procurar o pedido na tabela de produtos
        var rows = document.querySelectorAll('#tableBody tr.pedido-row');
        var encontrado = false;
        
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var cell = row.querySelector('td:first-child');
            if (cell) {
                var texto = cell.textContent.replace('▶', '').replace('▼', '').trim();
                if (texto === String(pedidoId)) {
                    encontrado = true;
                    console.log('✅ Pedido encontrado nos produtos!');
                    
                    // Scroll até o pedido
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // Destacar o pedido
                    row.style.transition = 'background 0.3s';
                    row.style.background = '#e3f2fd';
                    
                    // Abrir os detalhes do pedido
                    var detailId = 'detalhe-produtos-' + pedidoId;
                    var detailRow = document.getElementById(detailId);
                    if (detailRow) {
                        detailRow.classList.add('show');
                        var icon = row.querySelector('.expand-icon');
                        if (icon) {
                            icon.innerHTML = '▼';
                        }
                        
                        // Carregar produtos detalhados
                        if (typeof window.carregarProdutosDetalhados === 'function') {
                            window.carregarProdutosDetalhados(pedidoId);
                        }
                    }
                    
                    // Adicionar botões de organização
                    if (typeof window.adicionarBotoesAoPedido === 'function') {
                        setTimeout(function() {
                            window.adicionarBotoesAoPedido(pedidoId);
                        }, 500);
                    }
                    
                    setTimeout(function() {
                        row.style.background = '';
                    }, 5000);
                    
                    clearInterval(intervalo);
                    return;
                }
            }
        }
        
        if (!encontrado && tentativas >= maxTentativas) {
            console.log('⚠️ Pedido não encontrado nos produtos após ' + maxTentativas + ' tentativas');
            clearInterval(intervalo);
        }
    }, 300);
}

/**
 * ORGANIZA OS PRODUTOS DENTRO DO DETALHE
 */
function organizarDetalhe(pedidoId, criterio) {
    console.log('🔄 Organizando pedido ' + pedidoId + ' por: ' + criterio);
    
    var detailRow = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!detailRow) return;
    
    var tabela = detailRow.querySelector('table');
    if (!tabela) return;
    
    var tbody = tabela.querySelector('tbody');
    if (!tbody) return;
    
    var todasLinhas = tbody.querySelectorAll('tr');
    var linhaProdutos = null;
    
    for (var i = 0; i < todasLinhas.length; i++) {
        if (todasLinhas[i].id === 'body-condensado-' + pedidoId) {
            linhaProdutos = todasLinhas[i];
            break;
        }
    }
    
    if (!linhaProdutos) return;
    
    var tabelaProdutos = linhaProdutos.querySelector('table');
    if (!tabelaProdutos) return;
    
    var tbodyProdutos = tabelaProdutos.querySelector('tbody');
    if (!tbodyProdutos) return;
    
    var linhasProdutos = tbodyProdutos.querySelectorAll('tr');
    if (linhasProdutos.length === 0) return;
    
    var colunaIndex = criterio === 'lucro' ? 8 : (criterio === 'lucroPercentual' ? 9 : 2);
    
    function extrairValor(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length <= colunaIndex) return 0;
        var texto = cells[colunaIndex].textContent.trim();
        texto = texto.replace(/R\$\s*/g, '');
        texto = texto.replace(/\./g, '').replace(',', '.');
        texto = texto.replace(/%/g, '');
        return parseFloat(texto) || 0;
    }
    
    var linhasArray = Array.from(linhasProdutos);
    linhasArray.sort(function(a, b) {
        return extrairValor(b) - extrairValor(a);
    });
    
    tbodyProdutos.innerHTML = '';
    for (var i = 0; i < linhasArray.length; i++) {
        tbodyProdutos.appendChild(linhasArray[i]);
    }
    
    var todasLinhasAtualizadas = tbodyProdutos.querySelectorAll('tr');
    for (var i = 0; i < todasLinhasAtualizadas.length; i++) {
        var row = todasLinhasAtualizadas[i];
        var cells = row.querySelectorAll('td');
        if (cells.length > colunaIndex) {
            for (var j = 0; j < cells.length; j++) {
                if (j === colunaIndex) {
                    cells[j].style.fontWeight = 'bold';
                    cells[j].style.color = '#0b4f6c';
                    cells[j].style.background = '#e3f2fd';
                } else {
                    cells[j].style.fontWeight = '';
                    cells[j].style.color = '';
                    cells[j].style.background = '';
                }
            }
        }
    }
    
    console.log('✅ Pedido ' + pedidoId + ' organizado por ' + criterio);
}

/**
 * CALCULA A PRÓXIMA SEMANA (SÁBADO A SEXTA)
 */
function getProximaSemana() {
    var hoje = new Date();
    var diaSemana = hoje.getDay();
    var diasAteSabado = (6 - diaSemana + 7) % 7;
    if (diasAteSabado === 0) diasAteSabado = 7;
    var sabado = new Date(hoje);
    sabado.setDate(hoje.getDate() + diasAteSabado);
    var sexta = new Date(sabado);
    sexta.setDate(sabado.getDate() + 6);
    return { sabado: sabado, sexta: sexta };
}

/**
 * MOSTRA BOLETOS DA PRÓXIMA SEMANA
 */

    var { sabado, sexta } = getProximaSemana();
    
    if (semanaInfo) {
        semanaInfo.innerHTML = '📅 Próxima semana: ' + 
            sabado.toLocaleDateString('pt-BR') + ' a ' +

/**
 * OBTÉM O PERÍODO ATIVO SELECIONADO
 */
function getPeriodoAtivo() {
    var botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
    var periodoAtivo = 'todo';
    
    botoes.forEach(function(btn) {
        if (btn.classList.contains('active')) {
            var texto = btn.textContent.trim();
            if (texto === 'Todo o período') periodoAtivo = 'todo';
            else if (texto === 'Esse mês') periodoAtivo = 'mes';
            else if (texto === 'Últimos 3 meses') periodoAtivo = '3meses';
            else if (texto === 'Últimos 5 meses') periodoAtivo = '5meses';
            else if (texto === 'Últimos 8 meses') periodoAtivo = '8meses';
            else if (texto === 'Últimos 12 meses') periodoAtivo = '12meses';
        }
    });
    
    return periodoAtivo;
}

/**
 * CALCULA A DATA LIMITE PARA UM PERÍODO
 */
function getDataLimite(periodo) {
    var agora = new Date();
    var dataLimite = null;
    
    if (periodo === 'mes') {
        dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    } else if (periodo === '3meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 3);
    } else if (periodo === '5meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 5);
    } else if (periodo === '8meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 8);
    } else if (periodo === '12meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 12);
    }
    
    return dataLimite;
}

/**
 * FILTRA OS PEDIDOS DE UM PRODUTO PELO PERÍODO
 */
function filtrarPedidosDoProdutoPorPeriodo(codigo, periodo) {
    var dataLimite = getDataLimite(periodo);
    var pedidosFiltrados = [];
    
    for (var p = 0; p < produtosData.length; p++) {
        var pedido = produtosData[p];
        
        if (dataLimite) {
            var dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) {
                continue;
            }
        }
        
        if (!pedido.linhas) continue;
        
        var encontrou = false;
        var quantidadeTotal = 0;
        var valorCompraTotal = 0;
        var valorVenda = 0;
        
        for (var l = 0; l < pedido.linhas.length; l++) {
            var linha = pedido.linhas[l];
            if (linha.codigo === codigo && !linha.isIndisponivel) {
                encontrou = true;
                var qtd = parseInt(linha.quantidade) || 0;
                var valorUnit = linha.valorUnit || 0;
                var vendaUnit = linha.vendaUnit || 0;
                quantidadeTotal += qtd;
                valorCompraTotal += valorUnit * qtd;
                valorVenda = vendaUnit;
            }
        }
        
        if (encontrou) {
            pedidosFiltrados.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidadeTotal: quantidadeTotal,
                valorCompraTotal: valorCompraTotal,
                valorVenda: valorVenda
            });
        }
    }
    
    return pedidosFiltrados;
}

// ============================================================
// FUNÇÃO PARA BAIXAR BOLETOS PAGOS DO MÊS
// ============================================================

function baixarBoletosPagosDoMes(mesAno) {
    console.log('📥 Baixando boletos pagos do mês:', mesAno);
    
    // ===== EXTRAIR MÊS E ANO =====
    var partes = mesAno.split('/');
    var mes = parseInt(partes[0]);
    var ano = parseInt(partes[1]);
    
    console.log('📅 Mês:', mes, 'Ano:', ano);
    
    // ===== FILTRAR BOLETOS PAGOS DO MÊS =====
    var boletosPagos = [];
    
    if (typeof pedidosData !== 'undefined' && pedidosData.length > 0) {
        pedidosData.forEach(function(p) {
            // Processar parcelas de produto
            if (p.parcelasProduto) {
                p.parcelasProduto.forEach(function(parc) {
                    // Verificar se está pago (status da planilha OU checkbox manual)
                    var pago = (parc.status === 'Pagos') || isPago(p.pedido, parc.num, 'produto');
                    if (pago) {
                        var dataParc = dataParaComparacao(parc.vencimento);
                        if (dataParc.getMonth() + 1 === mes && dataParc.getFullYear() === ano) {
                            boletosPagos.push({
                                dia: dataParc.getDate(),
                                valor: parc.valor,
                                tipo: 'produto'
                            });
                        }
                    }
                });
            }
            
            // Processar parcelas de royalties
            if (p.parcelasRoyalties) {
                p.parcelasRoyalties.forEach(function(parc) {
                    var pago = (parc.status === 'Pagos') || isPago(p.pedido, parc.num, 'royalties');
                    if (pago) {
                        var dataParc = dataParaComparacao(parc.vencimento);
                        if (dataParc.getMonth() + 1 === mes && dataParc.getFullYear() === ano) {
                            boletosPagos.push({
                                dia: dataParc.getDate(),
                                valor: parc.valor,
                                tipo: 'royalties'
                            });
                        }
                    }
                });
            }
            
            // Processar parcelas de propaganda
            if (p.parcelasPropaganda) {
                p.parcelasPropaganda.forEach(function(parc) {
                    var pago = (parc.status === 'Pagos') || isPago(p.pedido, parc.num, 'propaganda');
                    if (pago) {
                        var dataParc = dataParaComparacao(parc.vencimento);
                        if (dataParc.getMonth() + 1 === mes && dataParc.getFullYear() === ano) {
                            boletosPagos.push({
                                dia: dataParc.getDate(),
                                valor: parc.valor,
                                tipo: 'propaganda'
                            });
                        }
                    }
                });
            }
        });
    }
    
    console.log('📊 Boletos pagos encontrados:', boletosPagos.length);
    
    if (boletosPagos.length === 0) {
        alert('Nenhum boleto pago encontrado para este mês.');
        return;
    }
    
    // ===== CALCULAR DIAS DO MÊS =====
    var ultimoDia = new Date(ano, mes, 0).getDate();
    console.log('📅 Último dia do mês:', ultimoDia);
    
    // ===== ORGANIZAR VALORES POR DIA E TIPO =====
    var dias = {};
    for (var d = 1; d <= ultimoDia; d++) {
        dias[d] = { produto: 0, royalties: 0, propaganda: 0 };
    }
    
    boletosPagos.forEach(function(b) {
        if (b.tipo === 'produto') {
            dias[b.dia].produto += b.valor;
        } else if (b.tipo === 'royalties') {
            dias[b.dia].royalties += b.valor;
        } else if (b.tipo === 'propaganda') {
            dias[b.dia].propaganda += b.valor;
        }
    });
    
    // ===== GERAR LINHAS DO CSV =====
    var meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    var nomeMes = meses[mes - 1];
    
    // ===== LINHA 1: Cabeçalho com os dias =====
    var linha1 = '';
    for (var d = 1; d <= ultimoDia; d++) {
        linha1 += ';' + String(d).padStart(2, '0') + '/' + nomeMes;
    }
    
    // ===== LINHA 2: Produtos = Natura (ARREDONDADO) =====
    var linha2 = 'Produtos = Natura';
    for (var d = 1; d <= ultimoDia; d++) {
        linha2 += ';' + formatarNumeroCSV(arredondarValor(dias[d].produto));
    }
    
    // ===== LINHA 3: Produtos = Outras Marcas (vazio) =====
    var linha3 = 'Produtos = Outras Marcas';
    for (var d = 1; d <= ultimoDia; d++) {
        linha3 += ';';
    }
    
    // ===== LINHA 4: Royalties (ARREDONDADO) =====
    var linha4 = 'Royalties';
    for (var d = 1; d <= ultimoDia; d++) {
        linha4 += ';' + formatarNumeroCSV(arredondarValor(dias[d].royalties));
    }
    
    // ===== LINHA 5: Fundo de Propaganda (ARREDONDADO) =====
    var linha5 = 'Fundo de Propaganda';
    for (var d = 1; d <= ultimoDia; d++) {
        linha5 += ';' + formatarNumeroCSV(arredondarValor(dias[d].propaganda));
    }
    
    // ===== MONTAR O CSV =====
    var csvContent = [linha1, linha2, linha3, linha4, linha5].join('\n');
    
    // ===== BAIXAR O ARQUIVO =====
    var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.download = 'boletos_pagos_' + mesAno.replace('/', '_') + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    console.log('✅ Arquivo baixado: boletos_pagos_' + mesAno.replace('/', '_') + '.csv');
    showNotification('✅ Arquivo baixado: boletos_pagos_' + mesAno.replace('/', '_') + '.csv', 'success');
}

// ===== FUNÇÕES AUXILIARES =====
function arredondarValor(valor) {
    return Math.round(valor);
}

function formatarNumeroCSV(valor) {
    if (valor === 0) return '0,00';
    return valor.toFixed(2).replace('.', ',');
}

// ============================================================
// CALCULAR PRODUTOS COM PREÇO MÉDIO DE COMPRA
// ============================================================

function calcularProdutosPrecoMedio(periodo) {
    console.log('🔄 Calculando preço médio de compra...');
    
    // ===== 1. DEFINIR DATA LIMITE =====
    let dataLimite = null;
    const agora = new Date();
    
    if (periodo === 'mes') {
        dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    } else if (periodo === '3meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 3);
    } else if (periodo === '5meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 5);
    } else if (periodo === '8meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 8);
    } else if (periodo === '12meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 12);
    }
    
    // ===== 2. AGRUPAR PRODUTOS =====
    const produtos = {};
    let totalPedidos = 0;
    
    if (typeof produtosData === 'undefined' || produtosData.length === 0) {
        console.warn('⚠️ produtosData não carregado');
        return [];
    }
    
    for (let p = 0; p < produtosData.length; p++) {
        const pedido = produtosData[p];
        
        // Filtrar por período
        if (dataLimite) {
            const dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        
        totalPedidos++;
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        
        const produtosDoPedido = {};
        
        for (let l = 0; l < pedido.linhas.length; l++) {
            const linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            
            const codigo = linha.codigo;
            if (!codigo) continue;
            
            const vendaUnit = linha.vendaUnit || 0;
            const chave = vendaUnit > 0 ? codigo + '_' + vendaUnit : codigo;
            
            if (!produtosDoPedido[chave]) {
                produtosDoPedido[chave] = {
                    codigo: codigo,
                    produto: linha.produto,
                    vendaUnit: vendaUnit,
                    quantidadeTotal: 0,
                    valorCompraTotal: 0,
                    valoresCompra: [],
                    items: []
                };
            }
            
            const qtd = parseInt(linha.quantidade) || 0;
            const valorUnit = linha.valorUnit || 0;
            
            produtosDoPedido[chave].quantidadeTotal += qtd;
            produtosDoPedido[chave].valorCompraTotal += valorUnit * qtd;
            produtosDoPedido[chave].valoresCompra.push(valorUnit);
            produtosDoPedido[chave].items.push({
                quantidade: qtd,
                valorUnit: valorUnit
            });
        }
        
        for (const chave in produtosDoPedido) {
            const item = produtosDoPedido[chave];
            const codigo = item.codigo;
            
            // Calcular valor médio de compra
            const valorCompraMedio = item.quantidadeTotal > 0 ? 
                item.valorCompraTotal / item.quantidadeTotal : 0;
            
            // Calcular lucro unitário
            const lucroUni = item.vendaUnit - valorCompraMedio;
            const lucroPercentual = valorCompraMedio > 0 ? 
                (lucroUni / valorCompraMedio) * 100 : 0;
            
            if (!produtos[codigo]) {
                produtos[codigo] = {
                    codigo: codigo,
                    produto: item.produto,
                    vezes: 0,
                    quantidadeTotal: 0,
                    valoresCompra: [],
                    valoresVenda: [],
                    lucros: [],
                    lucrosPercentuais: [],
                    precoMedioMin: null,
                    precoMedioMax: null,
                    pedidos: []
                };
            }
            
            const prod = produtos[codigo];
            prod.vezes++;
            prod.quantidadeTotal += item.quantidadeTotal;
            
            // Armazenar valores
            if (valorCompraMedio > 0) {
                prod.valoresCompra.push(valorCompraMedio);
            }
            if (item.vendaUnit > 0) {
                prod.valoresVenda.push(item.vendaUnit);
            }
            if (lucroUni > 0) {
                prod.lucros.push(lucroUni);
            }
            if (lucroPercentual > 0) {
                prod.lucrosPercentuais.push(lucroPercentual);
            }
            
            // Armazenar pedidos
            prod.pedidos.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidade: item.quantidadeTotal,
                valorCompra: valorCompraMedio,
                valorVenda: item.vendaUnit,
                lucroUni: lucroUni,
                lucroPercentual: lucroPercentual
            });
        }
    }
    
    // ===== 3. CALCULAR PREÇO MÉDIO POR PRODUTO =====
    const resultados = Object.values(produtos);
    
    for (let i = 0; i < resultados.length; i++) {
        const prod = resultados[i];
        
        if (prod.valoresCompra.length > 0) {
            // Menor valor de compra
            const minCompra = Math.min.apply(null, prod.valoresCompra);
            // Maior valor de compra
            const maxCompra = Math.max.apply(null, prod.valoresCompra);
            
            // Preço médio = (menor + maior) / 2
            prod.precoMedioMin = minCompra;
            prod.precoMedioMax = maxCompra;
            prod.precoMedio = (minCompra + maxCompra) / 2;
        } else {
            prod.precoMedioMin = 0;
            prod.precoMedioMax = 0;
            prod.precoMedio = 0;
        }
    }
    
    // ===== 4. ORDENAR POR PREÇO MÉDIO (PADRÃO) =====
    resultados.sort(function(a, b) {
        return b.precoMedio - a.precoMedio;
    });
    
    console.log('✅ ' + resultados.length + ' produtos calculados com preço médio');
    return resultados;
}

function destacarCelulasPrecoMedio(coluna) {
