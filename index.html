        colunaIndex = 2;
    }
    
    const cells = document.querySelectorAll('#tableWrapper td:nth-child(' + (colunaIndex + 1) + ')');
    cells.forEach(function(cell) {
        cell.style.fontWeight = 'bold';

    row.classList.toggle('show');

    if (row.classList.contains('show')) {

        // Carregar pedidos do produto
        const periodo = window.periodoAtualPrecoMedio || 'todo';
        const dataLimite = getDataLimitePrecoMedio(periodo);
        const pedidos = buscarPedidosDoProdutoPrecoMedio(codigo, dataLimite);

                        <th style="padding:6px 8px; text-align:right;">Valor Venda Uni</th>

            const item = pedidos[i];

            const lucroUni = item.valorVenda - valorCompraMedio;
            const lucroTotal = lucroUni * qtd;
            const lucroPercentual = valorCompraTotal > 0 ? (lucroTotal / valorCompraTotal) * 100 : 0;

            html += `

// ============================================================
// BUSCAR PEDIDOS DO PRODUTO
// ============================================================

function buscarPedidosDoProdutoPrecoMedio(codigo, dataLimite) {
    const pedidosEncontrados = [];
    
    if (typeof produtosData === 'undefined' || produtosData.length === 0) {
        return pedidosEncontrados;
    }
    
    for (let p = 0; p < produtosData.length; p++) {
        const pedido = produtosData[p];
        
        if (dataLimite) {
            const dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        
        if (!pedido.linhas) continue;
        
        let quantidadeTotal = 0;
        let valorCompraTotal = 0;
        let valorVenda = 0;
        let encontrou = false;
        
        for (let l = 0; l < pedido.linhas.length; l++) {
            const linha = pedido.linhas[l];
            if (linha.codigo === codigo && !linha.isIndisponivel) {
                encontrou = true;
                const qtd = parseInt(linha.quantidade) || 0;
                const valorUnit = linha.valorUnit || 0;
                const vendaUnit = linha.vendaUnit || 0;
                quantidadeTotal += qtd;
                valorCompraTotal += valorUnit * qtd;
                valorVenda = vendaUnit;
            }
        }
        
        if (encontrou) {
            pedidosEncontrados.push({
                pedido: pedido.pedido,
                data: pedido.data,
                quantidadeTotal: quantidadeTotal,
                valorCompraTotal: valorCompraTotal,
                valorVenda: valorVenda
            });
        }
    }
    
    return pedidosEncontrados;
}

// ============================================================
// FUNÇÕES AUXILIARES DO PREÇO MÉDIO
// ============================================================

function getDataLimitePrecoMedio(periodo) {
    const agora = new Date();
    let dataLimite = null;
    
    if (periodo === 'mes') {
        dataLimite = new Date(agora.getFullYear(), agora.getMonth(), 1);
    } else if (periodo === '3meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 3);
    } else if (periodo === '5meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 5);
    } else if (periodo === '8meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 8);
    } else if (periodo === '12meses') {
        dataLimite = new Date(agora);
        dataLimite.setMonth(agora.getMonth() - 12);
    }
    
    return dataLimite;
}

/**
 * BUSCA PRODUTOS POR TERMO NO PREÇO MÉDIO
 */
function buscarProdutosPrecoMedioPorTermo(termo, periodo) {
    console.log('🔍 Buscando produtos com termo:', termo);
    
    const dataLimite = getDataLimitePrecoMedio(periodo);
    const termoLower = termo.toLowerCase();
    const resultados = [];
    
    if (typeof produtosData === 'undefined' || produtosData.length === 0) {
        return resultados;
    }
    
    // Mapa para agrupar produtos encontrados
    const produtosMap = {};
    
    for (let p = 0; p < produtosData.length; p++) {
        const pedido = produtosData[p];
        
        if (dataLimite) {
            const dataPedido = new Date(pedido.data.split('/').reverse().join('/'));
            if (dataPedido < dataLimite) continue;
        }
        
        if (!pedido.linhas || pedido.linhas.length === 0) continue;
        
        for (let l = 0; l < pedido.linhas.length; l++) {
            const linha = pedido.linhas[l];
            if (linha.isIndisponivel) continue;
            
            const codigo = (linha.codigo || '').toLowerCase();
            const produto = (linha.produto || '').toLowerCase();
            
            // Verifica se o termo está no código ou no nome do produto
            if (codigo.indexOf(termoLower) !== -1 || produto.indexOf(termoLower) !== -1) {
                const chave = linha.codigo;
                
                if (!produtosMap[chave]) {
                    const qtd = parseInt(linha.quantidade) || 0;
                    const valorUnit = linha.valorUnit || 0;
                    const vendaUnit = linha.vendaUnit || 0;
                    const lucroUni = vendaUnit - valorUnit;
                    const lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    
                    produtosMap[chave] = {
                        codigo: linha.codigo || '',
                        produto: linha.produto || '',
                        vezes: 1,
                        quantidadeTotal: qtd,
                        valoresCompra: [valorUnit],
                        valoresVenda: [vendaUnit],
                        lucros: [lucroUni],
                        lucrosPercentuais: [lucroPercentual],
                        precoMedioMin: valorUnit,
                        precoMedioMax: valorUnit,
                        precoMedio: valorUnit,
                        pedidos: [{
                            pedido: pedido.pedido,
                            data: pedido.data,
                            quantidade: qtd,
                            valorCompra: valorUnit,
                            valorVenda: vendaUnit,
                            lucroUni: lucroUni,
                            lucroPercentual: lucroPercentual
                        }]
                    };
                } else {
                    const item = produtosMap[chave];
                    const qtd = parseInt(linha.quantidade) || 0;
                    const valorUnit = linha.valorUnit || 0;
                    const vendaUnit = linha.vendaUnit || 0;
                    const lucroUni = vendaUnit - valorUnit;
                    const lucroPercentual = valorUnit > 0 ? (lucroUni / valorUnit) * 100 : 0;
                    
                    item.vezes++;
                    item.quantidadeTotal += qtd;
                    item.valoresCompra.push(valorUnit);
                    item.valoresVenda.push(vendaUnit);
                    item.lucros.push(lucroUni);
                    item.lucrosPercentuais.push(lucroPercentual);
                    item.pedidos.push({
                        pedido: pedido.pedido,
                        data: pedido.data,
                        quantidade: qtd,
                        valorCompra: valorUnit,
                        valorVenda: vendaUnit,
                        lucroUni: lucroUni,
                        lucroPercentual: lucroPercentual
                    });
                    
                    // Atualizar preço médio (min e max)
                    if (valorUnit < item.precoMedioMin) item.precoMedioMin = valorUnit;
                    if (valorUnit > item.precoMedioMax) item.precoMedioMax = valorUnit;
                    item.precoMedio = (item.precoMedioMin + item.precoMedioMax) / 2;
                }
            }
        }
    }
    
    // Converter mapa para array e ordenar
    const resultadosArray = Object.values(produtosMap);
    
    // Ordenar por preço médio (padrão)
    resultadosArray.sort(function(a, b) {
        return b.precoMedio - a.precoMedio;
    });
    
    console.log('✅ ' + resultadosArray.length + ' produtos encontrados para o termo "' + termo + '"');
    return resultadosArray;
}
