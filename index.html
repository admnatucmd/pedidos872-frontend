function inicializarSistemaNavegacao() {
    console.log('🔧 Inicializando sistema de navegação...');
    setTimeout(function() {
        tornarPedidosClicaveis();
        corrigirBotoesPeriodo();
    }, 500);
}

function tornarPedidosClicaveis() {
    var detailTables = document.querySelectorAll('.detail-card table');
    var encontrados = 0;
    detailTables.forEach(function(tabela) {
        var rows = tabela.querySelectorAll('tbody tr');
        rows.forEach(function(row) {
            var cells = row.querySelectorAll('td');
            if (cells.length === 0) return;
            var celulaPedido = cells[0];
            var textoPedido = celulaPedido.textContent.trim();
            if (/^\d{9}$/.test(textoPedido) && !celulaPedido.querySelector('a')) {
                var pedidoId = textoPedido;
                var codigoProduto = '';
                var nomeProduto = '';
                var tabelaPai = row.closest('table');
                var cabecalhos = tabelaPai.querySelectorAll('thead th');
                var idxCodigo = -1, idxProduto = -1;
                cabecalhos.forEach(function(th, index) {
                    var texto = th.textContent.trim();
                    if (texto === 'Código' || texto === 'Cód') idxCodigo = index;
                    if (texto === 'Produto' || texto.indexOf('Produto') !== -1) idxProduto = index;
                });
                if (idxCodigo !== -1 && cells[idxCodigo]) codigoProduto = cells[idxCodigo].textContent.trim();
                if (idxProduto !== -1 && cells[idxProduto]) nomeProduto = cells[idxProduto].textContent.trim();
                if (!codigoProduto) {
                    var card = row.closest('.detail-card');
                    if (card) {
                        var titulo = card.querySelector('strong');
                        if (titulo) {
                            var match = titulo.textContent.match(/produto\s*(\d+)/i);
                            if (match) codigoProduto = match[1];
                            var matchNome = titulo.textContent.match(/-\s*(.+?)(?:\s*\(|$)/);
                            if (matchNome) nomeProduto = matchNome[1].trim();
                        }
                    }
                }
                var link = document.createElement('a');
                link.href = '#';
                link.textContent = pedidoId;
                link.style.color = '#0b4f6c';
                link.style.textDecoration = 'underline';
                link.style.cursor = 'pointer';
                link.style.fontWeight = 'bold';
                link.title = 'Ir para o pedido ' + pedidoId + ' em "Produtos por pedido"';
                link.dataset.pedidoId = pedidoId;
                link.dataset.codigoProduto = codigoProduto || '';
                link.dataset.nomeProduto = nomeProduto || '';
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    irParaPedido(this.dataset.pedidoId, this.dataset.codigoProduto, this.dataset.nomeProduto);
                });
                celulaPedido.innerHTML = '';
                celulaPedido.appendChild(link);
                encontrados++;
            }
        });
    });
    if (encontrados > 0) console.log('✅ ' + encontrados + ' pedidos nos detalhes tornados clicáveis!');
}

function corrigirBotoesPeriodo() {
    if (typeof window.filtrarProdutosPorPedido === 'function') {
        var original = window.filtrarProdutosPorPedido;
        window.filtrarProdutosPorPedido = function(periodo) {
            original(periodo);
            setTimeout(function() {
                var botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
                botoes.forEach(function(btn) { btn.classList.remove('active'); });
                var periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
                botoes.forEach(function(btn) {
                    if (btn.textContent.trim() === periodos[periodo]) btn.classList.add('active');
                });
            }, 500);
        };
    }
    var filtros = ['filtrarMaisPedidos', 'filtrarMaiorLucro', 'filtrarMenosPedidos', 'filtrarMaiorDiferenca'];
    filtros.forEach(function(nome) {
        if (typeof window[nome] === 'function') {
            var original = window[nome];
            window[nome] = function(periodo) {
                original(periodo);
                setTimeout(function() {
                    var botoes = document.querySelectorAll('#semanaInfo .btn-submenu');
                    botoes.forEach(function(btn) { btn.classList.remove('active'); });
                    var periodos = { 'todo': 'Todo o período', 'mes': 'Esse mês', '3meses': 'Últimos 3 meses', '5meses': 'Últimos 5 meses', '8meses': 'Últimos 8 meses', '12meses': 'Últimos 12 meses' };
                    botoes.forEach(function(btn) {
                        if (btn.textContent.trim() === periodos[periodo]) btn.classList.add('active');
                    });
                }, 500);
            };
        }
    });
}

function adicionarBotoesATodosDetalhes() {
    var detailRows = document.querySelectorAll('.parcelas-detail.show');
    var adicionados = 0;
    detailRows.forEach(function(row) {
        var id = row.id || '';
        if (id.indexOf('detalhe-produtos-') === 0) {
            var pedidoId = id.replace('detalhe-produtos-', '');
            if (adicionarBotoesAoPedido(pedidoId)) adicionados++;
        }
    });
    if (adicionados > 0) console.log('✅ Botões adicionados a ' + adicionados + ' detalhes');
}

function adicionarBotoesAoPedido(pedidoId) {
    var detailRow = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!detailRow) return false;
    if (!detailRow.classList.contains('show')) return false;
    var detailCard = detailRow.querySelector('.detail-card');
    if (!detailCard) return false;
    if (detailCard.querySelector('.btn-organizar-detalhe')) return true;
    var toggleBtn = detailCard.querySelector('button[onclick*="toggleVisualizacaoProdutos"]');
    if (!toggleBtn) {
        var botoes = detailCard.querySelectorAll('button');
        botoes.forEach(function(btn) {
            if (btn.textContent.indexOf('Mostrar igual do site natura') !== -1) toggleBtn = btn;
        });
    }
    if (!toggleBtn) {
        setTimeout(function() { adicionarBotoesAoPedido(pedidoId); }, 500);
        return false;
    }
    var container = document.createElement('div');
    container.style.cssText = 'display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; padding:6px 0; border-top:1px solid #e5e7eb;';
    var label = document.createElement('span');
    label.textContent = 'Organizar pedido por:';
    label.style.cssText = 'font-size:12px; font-weight:600; color:#555; margin-right:4px;';
    container.appendChild(label);
    var btn1 = document.createElement('button');
    btn1.className = 'btn-organizar-detalhe';
    btn1.textContent = 'Maior lucro R$';
    btn1.style.cssText = 'background:#e8f4f8; color:#0b4f6c; border:1px solid #d0e4ed; padding:3px 10px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:500;';
    btn1.onclick = function() { organizarDetalhe(pedidoId, 'lucro'); };
    container.appendChild(btn1);
    var btn2 = document.createElement('button');
    btn2.className = 'btn-organizar-detalhe';
    btn2.textContent = 'Maior lucro %';
    btn2.style.cssText = 'background:#e8f4f8; color:#0b4f6c; border:1px solid #d0e4ed; padding:3px 10px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:500;';
    btn2.onclick = function() { organizarDetalhe(pedidoId, 'lucroPercentual'); };
    container.appendChild(btn2);
    var btn3 = document.createElement('button');
    btn3.className = 'btn-organizar-detalhe';
    btn3.textContent = 'Maior qtd';
    btn3.style.cssText = 'background:#e8f4f8; color:#0b4f6c; border:1px solid #d0e4ed; padding:3px 10px; border-radius:4px; cursor:pointer; font-size:10px; font-weight:500;';
    btn3.onclick = function() { organizarDetalhe(pedidoId, 'quantidade'); };
    container.appendChild(btn3);
    toggleBtn.parentNode.insertBefore(container, toggleBtn.nextSibling);
    return true;
}

function organizarDetalhe(pedidoId, criterio) {
    var detailRow = document.getElementById('detalhe-produtos-' + pedidoId);
    if (!detailRow) return;
    var tabela = detailRow.querySelector('table');
    if (!tabela) return;
    var tbody = tabela.querySelector('tbody');
    if (!tbody) return;
    var todasLinhas = tbody.querySelectorAll('tr');
    var linhaProdutos = null;
    todasLinhas.forEach(function(row) {
        if (row.id === 'body-condensado-' + pedidoId) linhaProdutos = row;
    });
    if (!linhaProdutos) return;
    var tabelaProdutos = linhaProdutos.querySelector('table');
    if (!tabelaProdutos) return;
    var tbodyProdutos = tabelaProdutos.querySelector('tbody');
    if (!tbodyProdutos) return;
    var linhasProdutos = tbodyProdutos.querySelectorAll('tr');
    if (linhasProdutos.length === 0) return;
    var colunaIndex = criterio === 'lucro' ? 8 : (criterio === 'lucroPercentual' ? 9 : 2);
    function extrairValor(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length <= colunaIndex) return 0;
        var texto = cells[colunaIndex].textContent.trim();
        texto = texto.replace(/R\$\s*/g, '');
        texto = texto.replace(/\./g, '').replace(',', '.');
        texto = texto.replace(/%/g, '');
        var valor = parseFloat(texto);
        return isNaN(valor) ? 0 : valor;
    }
    var linhasArray = Array.from(linhasProdutos);
    linhasArray.sort(function(a, b) { return extrairValor(b) - extrairValor(a); });
    tbodyProdutos.innerHTML = '';
    linhasArray.forEach(function(row) { tbodyProdutos.appendChild(row); });
    var todasLinhasAtualizadas = tbodyProdutos.querySelectorAll('tr');
    todasLinhasAtualizadas.forEach(function(row) {
        var cells = row.querySelectorAll('td');
        if (cells.length > colunaIndex) {
            cells.forEach(function(cell, idx) {
                if (idx === colunaIndex) {
                    cell.style.fontWeight = 'bold';
                    cell.style.color = '#0b4f6c';
                    cell.style.background = '#e3f2fd';
                } else {
                    cell.style.fontWeight = '';
                    cell.style.color = '';
                    cell.style.background = '';
                }
            });
        }
    });
}

var observerDetalhes = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
        if (mutation.type === 'childList') {
            var detailRows = document.querySelectorAll('.parcelas-detail.show');
            if (detailRows.length > 0) {
                var temBotoes = false;
                detailRows.forEach(function(row) {
                    if (row.querySelector('.btn-organizar-detalhe')) temBotoes = true;
                });
                if (!temBotoes) {
                    setTimeout(function() { adicionarBotoesATodosDetalhes(); }, 300);
                }
            }
        }
    });
});

var tableWrapper = document.getElementById('tableWrapper');
if (tableWrapper) {
    observerDetalhes.observe(tableWrapper, { childList: true, subtree: true });
}

function fecharSubmenuProdutos() {
    var submenuProdutos = document.getElementById('submenuProdutos');
    var btnProdutos = document.getElementById('btnProdutos');
    if (submenuProdutos) submenuProdutos.style.display = 'none';
    if (btnProdutos) btnProdutos.classList.remove('active');
    document.querySelectorAll('#submenuProdutos .btn-submenu').forEach(function(b) { b.classList.remove('active'); });
    var tableWrapper = document.getElementById('tableWrapper');
    var dataTable = document.getElementById('dataTable');
    var statsContainer = document.getElementById('statsContainer');
    var mesContainer = document.getElementById('mesContainer');
    if (!dataTable && tableWrapper) {
        tableWrapper.innerHTML = '<table id="dataTable"><thead><tr><th>Pedido</th><th>Data</th><th>NF</th><th>Valor Total</th><th>Produtos</th><th>Royalties</th><th>Propaganda</th><th>Parcelas</th><th>Valor Pendente</th><th>Situação</th></tr></thead><tbody id="tableBody"></tbody></table>';
    }
    if (dataTable) dataTable.style.display = 'table';
    if (statsContainer) statsContainer.classList.remove('stats-hidden');
    if (mesContainer) mesContainer.style.display = 'none';
    document.querySelectorAll('.btn-actions .btn').forEach(function(b) {
        if (b.id !== 'btnProdutos') b.classList.remove('active');
    });
}

window.mostrarPagosPorMes = function() {
    fecharSubmenuProdutos();
    if (typeof originalMostrarPagosPorMes === 'function') return originalMostrarPagosPorMes.apply(this, arguments);
};
window.mostrarPedidosPorMes = function() {

};
window.toggleSubmenuBoletos = function() {

};
window.voltarTabelaOriginal = function() {
    fecharSubmenuProdutos();

};
